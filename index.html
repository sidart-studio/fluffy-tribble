<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CubeWorld</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #cfe9f7; height: 100%; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
  import * as THREE from './vendor/three/three.module.min.js';

  // ═══════════════════════════════════════════════
  //  CONFIG
  // ═══════════════════════════════════════════════
  const CELL     = 2;   // world size of one voxel/grid cell
  const ISLAND_R = 5;   // island radius in cells — small, just enough for this scene
  const LAND_Y   = CELL;

  function cellWorld(gx, gz) { return { x: gx * CELL, z: gz * CELL }; }

  // ═══════════════════════════════════════════════
  //  RENDERER / SCENE
  // ═══════════════════════════════════════════════
  const canvas   = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  const FOG_COLOR = 0xCFE9F7;
  scene.fog = new THREE.Fog(FOG_COLOR, 18, 90);

  // ── Sky gradient dome ──
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(200, 20, 20),
    new THREE.ShaderMaterial({
      uniforms: {
        topColor:    { value: new THREE.Color(0x4E9BD6) },
        bottomColor: { value: new THREE.Color(FOG_COLOR) },
        offset:      { value: 8 },
        exponent:    { value: 0.7 },
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPosition = wp.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
        }`,
      side: THREE.BackSide,
      fog: false,
    })
  );
  scene.add(sky);

  // ═══════════════════════════════════════════════
  //  CAMERA — static isometric establishing shot
  // ═══════════════════════════════════════════════
  const viewSize = 9.5;
  const isoDir = new THREE.Vector3(1, 1, 1).normalize();
  const CAM_DIST = 30;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);

  function updateCameraFrustum() {
    const aspect = innerWidth / innerHeight;
    camera.left   = -viewSize * aspect;
    camera.right  =  viewSize * aspect;
    camera.top    =  viewSize;
    camera.bottom = -viewSize;
    camera.updateProjectionMatrix();
  }
  updateCameraFrustum();
  camera.position.copy(isoDir).multiplyScalar(CAM_DIST);
  camera.lookAt(0, 1, 0);

  // ═══════════════════════════════════════════════
  //  LIGHTS
  // ═══════════════════════════════════════════════
  scene.add(new THREE.HemisphereLight(0xBFE3F5, 0x6b8f5a, 0.65));
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  const sun = new THREE.DirectionalLight(0xFFF6DF, 1.3);
  sun.position.set(14, 20, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { near: 1, far: 60, left: -15, right: 15, top: 15, bottom: -15 });
  scene.add(sun);

  // ═══════════════════════════════════════════════
  //  OCEAN — flat-shaded low-poly waves, depth-tinted
  // ═══════════════════════════════════════════════
  const oceanGeo = new THREE.PlaneGeometry(300, 300, 50, 50);
  oceanGeo.rotateX(-Math.PI / 2);
  const oceanBase = oceanGeo.attributes.position.array.slice();

  const oceanColors = new Float32Array(oceanGeo.attributes.position.count * 3);
  const shallowC = new THREE.Color(0x5FCBDB), deepC = new THREE.Color(0x0F5FA0);
  for (let i = 0; i < oceanGeo.attributes.position.count; i++) {
    const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
    const d = Math.hypot(x, z);
    const tt = THREE.MathUtils.clamp((d - 10) / 40, 0, 1);
    const c = shallowC.clone().lerp(deepC, tt);
    oceanColors[i * 3] = c.r; oceanColors[i * 3 + 1] = c.g; oceanColors[i * 3 + 2] = c.b;
  }
  oceanGeo.setAttribute('color', new THREE.BufferAttribute(oceanColors, 3));

  const oceanMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true, flatShading: true, roughness: 0.35, metalness: 0.08,
  });
  const ocean = new THREE.Mesh(oceanGeo, oceanMat);
  ocean.position.y = 0.35;
  ocean.receiveShadow = true;
  scene.add(ocean);

  function updateOcean(t) {
    const pos = oceanGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
      pos.array[i * 3 + 1] = Math.sin(x * 0.18 + t * 1.4) * 0.28 + Math.cos(z * 0.22 + t * 1.1) * 0.22;
    }
    pos.needsUpdate = true;
  }

  // ═══════════════════════════════════════════════
  //  ISLAND — small voxel island (grass core / sand coast)
  // ═══════════════════════════════════════════════
  const cubeGeo = new THREE.BoxGeometry(CELL * 0.98, CELL, CELL * 0.98);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.9 });
  const sandMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.9 });

  const landCells = [];
  for (let gx = -ISLAND_R; gx <= ISLAND_R; gx++) {
    for (let gz = -ISLAND_R; gz <= ISLAND_R; gz++) {
      const dist = Math.sqrt(gx * gx + gz * gz);
      if (dist > ISLAND_R) continue;
      landCells.push({ gx, gz, sand: dist > ISLAND_R - 1.4 });
    }
  }
  const grassCells = landCells.filter(c => !c.sand);
  const sandCells  = landCells.filter(c => c.sand);

  function buildVoxelMesh(cells, mat, baseColor) {
    const mesh = new THREE.InstancedMesh(cubeGeo, mat, Math.max(cells.length, 1));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const m = new THREE.Matrix4();
    const c = new THREE.Color();
    cells.forEach((cell, i) => {
      const { x, z } = cellWorld(cell.gx, cell.gz);
      m.setPosition(x, LAND_Y / 2, z);
      mesh.setMatrixAt(i, m);
      c.copy(baseColor).multiplyScalar(0.88 + Math.random() * 0.24);
      mesh.setColorAt(i, c);
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    return mesh;
  }
  buildVoxelMesh(grassCells, grassMat, new THREE.Color(0x7CC576));
  buildVoxelMesh(sandCells, sandMat, new THREE.Color(0xE8D18C));

  // ═══════════════════════════════════════════════
  //  COCONUT TREE — the island's only tree
  // ═══════════════════════════════════════════════
  function makeCoconutTree() {
    const group = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0xA1795A, flatShading: true, roughness: 0.9 });

    // A gently curving trunk, built from stacked segments that lean a little more each step.
    let parent = group;
    let lean = 0;
    const segH = 0.62, segs = 5;
    for (let i = 0; i < segs; i++) {
      const r0 = 0.16 - i * 0.017, r1 = 0.19 - i * 0.017;
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, segH, 6), trunkMat);
      seg.position.y = segH / 2;
      seg.castShadow = true;
      const holder = new THREE.Group();
      holder.rotation.z = lean;
      holder.add(seg);
      parent.add(holder);
      const top = new THREE.Group();
      top.position.y = segH;
      holder.add(top);
      parent = top;
      lean += 0.1;
    }

    // Fronds fan out from the crown, drooping outward and down.
    const frondMat = new THREE.MeshStandardMaterial({ color: 0x2E8B3D, flatShading: true, roughness: 0.85 });
    const frondGeo = new THREE.ConeGeometry(0.26, 1.7, 4);
    frondGeo.translate(0, 0.85, 0); // base at origin, tip extends along +Y
    const frondCount = 7;
    for (let i = 0; i < frondCount; i++) {
      const a = (i / frondCount) * Math.PI * 2;
      const holder = new THREE.Group();
      holder.rotation.y = a;
      const frond = new THREE.Mesh(frondGeo, frondMat);
      frond.scale.x = 0.34; // flatten into a blade
      frond.rotation.x = 1.05; // droop outward and down from the crown
      frond.castShadow = true;
      holder.add(frond);
      parent.add(holder);
    }

    // A few coconuts clustered under the crown.
    const nutMat = new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true, roughness: 0.85 });
    for (let i = 0; i < 3; i++) {
      const a = i * 2.15;
      const nut = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), nutMat);
      nut.position.set(Math.cos(a) * 0.16, -0.05, Math.sin(a) * 0.16);
      nut.castShadow = true;
      parent.add(nut);
    }

    return group;
  }

  // ═══════════════════════════════════════════════
  //  WOODEN SHOP — small, windowless
  // ═══════════════════════════════════════════════
  function makeWoodenShop() {
    const group = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xC08A50, flatShading: true, roughness: 0.85 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x7B4F2B, flatShading: true, roughness: 0.85 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xE0B84B, flatShading: true, roughness: 0.9 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x4E3320, flatShading: true, roughness: 0.85 });

    const w = 1.6, h = 1.3, d = 1.4;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    body.position.y = h / 2;
    body.castShadow = true; body.receiveShadow = true;
    group.add(body);

    // Corner posts for a plank-built look — no window cutouts anywhere on the walls.
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, h + 0.15, 0.12), trimMat);
      post.position.set(sx * w / 2, (h + 0.15) / 2, sz * d / 2);
      post.castShadow = true;
      group.add(post);
    });

    // Pitched roof: two sloped panels meeting at a ridge.
    const roofPanelGeo = new THREE.BoxGeometry(w + 0.32, 0.1, d * 0.62);
    const roofL = new THREE.Mesh(roofPanelGeo, roofMat);
    roofL.position.set(0, h + 0.34, d * 0.16);
    roofL.rotation.x = 0.5;
    roofL.castShadow = true;
    const roofR = new THREE.Mesh(roofPanelGeo, roofMat);
    roofR.position.set(0, h + 0.34, -d * 0.16);
    roofR.rotation.x = -0.5;
    roofR.castShadow = true;
    group.add(roofL, roofR);
    const ridge = new THREE.Mesh(new THREE.BoxGeometry(w + 0.34, 0.14, 0.16), trimMat);
    ridge.position.set(0, h + 0.6, 0);
    group.add(ridge);

    // Door on the front face.
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.95, 0.05), doorMat);
    door.position.set(0, 0.475, d / 2 + 0.03);
    group.add(door);

    // Small awning over the doorway, reading as a shop counter rather than a window.
    const awning = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 0.5), trimMat);
    awning.position.set(0, h * 0.72, d / 2 + 0.28);
    awning.rotation.x = -0.15;
    awning.castShadow = true;
    group.add(awning);
    [-0.4, 0.4].forEach(sx => {
      const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6), trimMat);
      strut.position.set(sx, h * 0.55, d / 2 + 0.48);
      strut.rotation.x = 0.15;
      group.add(strut);
    });

    // Small hanging sign board.
    const sign = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.28, 0.04), trimMat);
    sign.position.set(0, h + 0.02, d / 2 + 0.06);
    group.add(sign);

    return group;
  }

  // ═══════════════════════════════════════════════
  //  CUBEY — a friendly cube, waving hello
  // ═══════════════════════════════════════════════
  function makeWavingCubey() {
    const group = new THREE.Group();
    const cubeyMat = new THREE.MeshStandardMaterial({ color: 0xFFB74D, flatShading: true, roughness: 0.7 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), cubeyMat);
    body.position.y = 0.5;
    body.castShadow = true;
    group.add(body);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x2d2d2d });
    [-0.22, 0.22].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), eyeMat);
      eye.position.set(ex, 0.62, 0.49);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
      pupil.position.set(ex, 0.62, 0.58);
      group.add(eye, pupil);
    });

    const footMat = new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true });
    const footL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.36), footMat);
    const footR = footL.clone();
    footL.position.set(-0.25, 0.11, 0);
    footR.position.set(0.25, 0.11, 0);
    footL.castShadow = true; footR.castShadow = true;
    group.add(footL, footR);

    // Waving arm, pivoted at the shoulder so it can swing.
    const armPivot = new THREE.Group();
    armPivot.position.set(0.53, 0.78, 0.1);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.16), cubeyMat);
    arm.position.set(0, -0.25, 0);
    arm.castShadow = true;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), cubeyMat);
    hand.position.set(0, -0.5, 0);
    armPivot.add(arm, hand);
    group.add(armPivot);

    group.userData.armPivot = armPivot;
    return group;
  }

  // ═══════════════════════════════════════════════
  //  PLACE THE SCENE
  // ═══════════════════════════════════════════════
  const tree = makeCoconutTree();
  const treePos = cellWorld(1, -2);
  tree.position.set(treePos.x, LAND_Y, treePos.z);
  scene.add(tree);

  const shop = makeWoodenShop();
  const shopPos = cellWorld(-1, -1);
  shop.position.set(shopPos.x, LAND_Y, shopPos.z);
  shop.rotation.y = 0.5;
  scene.add(shop);

  const cubey = makeWavingCubey();
  const cubeyPos = cellWorld(0, 1);
  cubey.position.set(cubeyPos.x, LAND_Y, cubeyPos.z);
  cubey.rotation.y = -0.3; // his face (+Z) and waving arm (+X) both sit toward the camera by default
  scene.add(cubey);

  // ═══════════════════════════════════════════════
  //  RESIZE
  // ═══════════════════════════════════════════════
  window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    updateCameraFrustum();
  });

  // ═══════════════════════════════════════════════
  //  RENDER LOOP
  // ═══════════════════════════════════════════════
  const clock = new THREE.Clock();
  const armPivot = cubey.userData.armPivot;

  function loop() {
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();

    updateOcean(t);
    armPivot.rotation.z = 2.75 + Math.sin(t * 5) * 0.35;

    renderer.render(scene, camera);
  }
  loop();
  </script>
</body>
</html>
