<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CubeWorld</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow: hidden; background: #cfe9f7; height: 100%; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    canvas { display: block; }

    #fade {
      position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
      transition: opacity .35s ease; z-index: 300;
    }
    #fade.show { opacity: 1; }

    #start-prompt {
      position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
      background: rgba(0,0,0,.55); color: #fff; padding: 10px 22px; border-radius: 30px;
      font-size: 14px; font-weight: 700; z-index: 150; cursor: pointer;
      opacity: 0; transition: opacity .6s ease; border: 2px solid rgba(255,255,255,.35);
    }
    #start-prompt.show { opacity: 1; }

    #inventory {
      position: fixed; top: 16px; left: 16px; z-index: 120;
      background: rgba(0,0,0,.4); border: 1.5px solid rgba(255,255,255,.25); border-radius: 14px;
      padding: 8px 16px; color: #fff; font-weight: 800; font-size: 16px;
      display: flex; align-items: center; gap: 8px;
      opacity: 0; transition: opacity .6s ease;
    }
    #inventory.show { opacity: 1; }
    #inventory .n { color: #FFD54F; }

    #hit-prompt {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) scale(.9);
      background: rgba(0,0,0,.65); color: #fff; padding: 9px 18px; border-radius: 26px;
      font-size: 14px; font-weight: 700; z-index: 130; border: 2px solid #FFD54F;
      display: none; align-items: center; gap: 8px; opacity: 0; transition: opacity .18s, transform .18s;
      pointer-events: none;
    }
    #hit-prompt.show { display: flex; opacity: 1; transform: translateX(-50%) scale(1); }
    #hit-prompt .k { background: #FFD54F; color: #3e2200; border-radius: 6px; padding: 2px 8px; font-size: 12px; }

    #joy-zone {
      position: fixed; left: 16px; bottom: 24px; width: 110px; height: 110px;
      border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3);
      z-index: 110; touch-action: none; display: none;
    }
    #joy-knob {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px;
      border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.8);
    }
    body.touch #joy-zone { display: block; }

    #hit-btn {
      position: fixed; right: 20px; bottom: 24px; z-index: 120;
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(180deg,#FFCA28,#FF9800); border: 3px solid #fff;
      font-size: 26px; display: none; align-items: center; justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,.35); cursor: pointer;
    }
    body.touch #hit-btn.ready { display: flex; }
    #hit-btn:active { transform: scale(.9); }

    #inventory .n2 { color: #8BE28B; }

    #speech-bubble {
      position: fixed; z-index: 140; transform: translate(-50%, -100%);
      background: #fff; color: #2d2d2d; border-radius: 16px; padding: 12px 14px;
      min-width: 190px; max-width: 240px; box-shadow: 0 6px 18px rgba(0,0,0,.3);
      display: none; text-align: center; font-size: 13px;
    }
    #speech-bubble.show { display: block; }
    #speech-bubble::after {
      content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -9px;
      border: 9px solid transparent; border-top-color: #fff;
    }
    #speech-text { font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
    #speech-buttons { display: flex; flex-direction: column; gap: 6px; }
    .speech-btn {
      border: 1.5px solid #ddd; background: #f4f4f4; border-radius: 10px;
      padding: 7px 10px; font-size: 12px; font-weight: 700; color: #2d2d2d;
      cursor: pointer; transition: background .12s;
    }
    .speech-btn:hover { background: #eaeaea; }
    .speech-btn:active { transform: scale(.97); }
    .speech-btn.cancel { color: #a33; }

    #toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      padding: 9px 20px; border-radius: 9px; font-size: 13px; font-weight: 700;
      color: #fff; z-index: 200; opacity: 0;
      transition: opacity .3s; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="fade"></div>
  <div id="start-prompt">Click to begin — drag or arrow keys to turn</div>
  <div id="inventory">🥥 <span class="n" id="coconut-count">0</span> &nbsp; 🪙 <span class="n2" id="coin-count">0</span></div>
  <div id="hit-prompt"><span class="k">E</span> Hit</div>
  <div id="joy-zone"><div id="joy-knob"></div></div>
  <div id="hit-btn">🥊</div>

  <div id="speech-bubble">
    <div id="speech-text">What do you want to sell?</div>
    <div id="speech-buttons">
      <div class="speech-btn" data-action="all">All my inventory</div>
      <div class="speech-btn" data-action="hand">This thing on your hand</div>
      <div class="speech-btn cancel" data-action="cancel">Cancel</div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
  import * as THREE from './vendor/three/three.module.min.js';

  // ═══════════════════════════════════════════════
  //  CONFIG
  // ═══════════════════════════════════════════════
  const CELL       = 2;   // world size of one voxel/grid cell
  const ISLAND_R   = 5;   // island radius in cells — small, just enough for this scene
  const LAND_Y     = CELL;
  const PLAYER_SPEED = 5.6;
  const EYE_HEIGHT   = 0.66;
  const HIT_RANGE    = 2.8;   // how close CUBEY needs to be to the tree to hit it
  const REGROW_MS    = 8000;  // how long until the tree grows new coconuts
  const SHOP_RANGE   = 2.6;   // how close, and in front of, the shop CUBEY needs to be
  const COCONUT_PRICE = 10;   // cubecoins per coconut
  const SHOP_WALK_MS = 1100;  // how long the shopkeeper takes to walk in/out
  const LAND_PRICE_BASE = 100; // first patch of land costs this
  const LAND_PRICE_STEP = 50;  // each later patch costs this much more
  const PATCH_DEPTH = 3;       // how many cells deep each purchased patch extends outward
  const PATCH_HALFW = 2;       // patches are (2*PATCH_HALFW + 1) cells wide
  const MAX_EXPANSIONS_PER_DIR = 3; // each side of the island can grow this many times
  const BUTTON_RANGE = 1.4;    // how close CUBEY must get to a red button to buy its land

  function cellWorld(gx, gz) { return { x: gx * CELL, z: gz * CELL }; }
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  // ═══════════════════════════════════════════════
  //  RENDERER / SCENE
  // ═══════════════════════════════════════════════
  const canvas   = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  const FOG_COLOR = 0xCFE9F7;
  scene.fog = new THREE.Fog(FOG_COLOR, 18, 90);

  // ── Sky gradient dome ──
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(200, 20, 20),
    new THREE.ShaderMaterial({
      uniforms: {
        topColor:    { value: new THREE.Color(0x4E9BD6) },
        bottomColor: { value: new THREE.Color(FOG_COLOR) },
        offset:      { value: 8 },
        exponent:    { value: 0.7 },
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPosition = wp.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
        }`,
      side: THREE.BackSide,
      fog: false,
    })
  );
  scene.add(sky);

  // ═══════════════════════════════════════════════
  //  CAMERAS — a static isometric intro shot that turns into first-person
  // ═══════════════════════════════════════════════
  const viewSize = 9.5;
  const isoDir = new THREE.Vector3(1, 1, 1).normalize();
  const CAM_DIST = 30;
  const introCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);

  function updateIntroFrustum() {
    const aspect = innerWidth / innerHeight;
    introCamera.left   = -viewSize * aspect;
    introCamera.right  =  viewSize * aspect;
    introCamera.top    =  viewSize;
    introCamera.bottom = -viewSize;
    introCamera.updateProjectionMatrix();
  }
  updateIntroFrustum();
  introCamera.position.copy(isoDir).multiplyScalar(CAM_DIST);
  introCamera.lookAt(0, 1, 0);

  const fpsCamera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 300);
  let activeCamera = introCamera;

  let yaw = -0.3, pitch = -0.15;
  const PITCH_LIMIT = Math.PI / 2 - 0.1;

  // ═══════════════════════════════════════════════
  //  LIGHTS
  // ═══════════════════════════════════════════════
  scene.add(new THREE.HemisphereLight(0xBFE3F5, 0x6b8f5a, 0.65));
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  const sun = new THREE.DirectionalLight(0xFFF6DF, 1.3);
  sun.position.set(14, 20, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { near: 1, far: 110, left: -32, right: 32, top: 32, bottom: -32 }); // sized for the fully-grown island
  scene.add(sun);

  // ═══════════════════════════════════════════════
  //  OCEAN — flat-shaded low-poly waves, depth-tinted
  // ═══════════════════════════════════════════════
  const oceanGeo = new THREE.PlaneGeometry(300, 300, 50, 50);
  oceanGeo.rotateX(-Math.PI / 2);
  const oceanBase = oceanGeo.attributes.position.array.slice();

  const oceanColors = new Float32Array(oceanGeo.attributes.position.count * 3);
  const shallowC = new THREE.Color(0x5FCBDB), deepC = new THREE.Color(0x0F5FA0);
  for (let i = 0; i < oceanGeo.attributes.position.count; i++) {
    const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
    const d = Math.hypot(x, z);
    const tt = THREE.MathUtils.clamp((d - 10) / 40, 0, 1);
    const c = shallowC.clone().lerp(deepC, tt);
    oceanColors[i * 3] = c.r; oceanColors[i * 3 + 1] = c.g; oceanColors[i * 3 + 2] = c.b;
  }
  oceanGeo.setAttribute('color', new THREE.BufferAttribute(oceanColors, 3));

  const oceanMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true, flatShading: true, roughness: 0.35, metalness: 0.08,
  });
  const ocean = new THREE.Mesh(oceanGeo, oceanMat);
  ocean.position.y = 0.35;
  ocean.receiveShadow = true;
  scene.add(ocean);

  function updateOcean(t) {
    const pos = oceanGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
      pos.array[i * 3 + 1] = Math.sin(x * 0.18 + t * 1.4) * 0.28 + Math.cos(z * 0.22 + t * 1.1) * 0.22;
    }
    pos.needsUpdate = true;
  }

  // ═══════════════════════════════════════════════
  //  ISLAND — voxel island stored as a set of owned cells, so purchased
  //  patches can grow it in any direction. Coastline (sand) is any cell
  //  touching the ocean; interior cells are grass.
  // ═══════════════════════════════════════════════
  const cubeGeo = new THREE.BoxGeometry(CELL * 0.98, CELL, CELL * 0.98);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.9 });
  const sandMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.9 });

  const landSet = new Set();
  let grassMesh = null, sandMesh = null;
  const cellKey = (gx, gz) => `${gx},${gz}`;

  // Seed: the little round starting island.
  for (let gx = -ISLAND_R; gx <= ISLAND_R; gx++) {
    for (let gz = -ISLAND_R; gz <= ISLAND_R; gz++) {
      if (Math.sqrt(gx * gx + gz * gz) <= ISLAND_R) landSet.add(cellKey(gx, gz));
    }
  }

  function isCoast(gx, gz) {
    for (let dx = -1; dx <= 1; dx++)
      for (let dz = -1; dz <= 1; dz++)
        if ((dx || dz) && !landSet.has(cellKey(gx + dx, gz + dz))) return true;
    return false;
  }

  function buildVoxelMesh(cells, mat, baseColor) {
    const mesh = new THREE.InstancedMesh(cubeGeo, mat, Math.max(cells.length, 1));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const m = new THREE.Matrix4();
    const c = new THREE.Color();
    cells.forEach((cell, i) => {
      const { x, z } = cellWorld(cell.gx, cell.gz);
      m.setPosition(x, LAND_Y / 2, z);
      mesh.setMatrixAt(i, m);
      c.copy(baseColor).multiplyScalar(0.88 + Math.random() * 0.24);
      mesh.setColorAt(i, c);
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    return mesh;
  }

  function rebuildIslandMeshes() {
    if (grassMesh) { scene.remove(grassMesh); grassMesh.dispose(); }
    if (sandMesh)  { scene.remove(sandMesh);  sandMesh.dispose(); }
    const grass = [], sand = [];
    for (const key of landSet) {
      const [gx, gz] = key.split(',').map(Number);
      (isCoast(gx, gz) ? sand : grass).push({ gx, gz });
    }
    grassMesh = buildVoxelMesh(grass, grassMat, new THREE.Color(0x7CC576));
    sandMesh  = buildVoxelMesh(sand,  sandMat,  new THREE.Color(0xE8D18C));
  }
  rebuildIslandMeshes();

  function isLand(x, z) {
    const gx = Math.round(x / CELL), gz = Math.round(z / CELL);
    return landSet.has(cellKey(gx, gz));
  }

  // ═══════════════════════════════════════════════
  //  COCONUT TREE — the island's only tree
  // ═══════════════════════════════════════════════
  const CROWN_HEIGHT = 3.05; // approximate height of the crown above the ground, for spawning falling coconuts

  function makeCoconutTree() {
    const group = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0xA1795A, flatShading: true, roughness: 0.9 });

    // A gently curving trunk, built from stacked segments that lean a little more each step.
    let parent = group;
    let lean = 0;
    const segH = 0.62, segs = 5;
    for (let i = 0; i < segs; i++) {
      const r0 = 0.16 - i * 0.017, r1 = 0.19 - i * 0.017;
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, segH, 6), trunkMat);
      seg.position.y = segH / 2;
      seg.castShadow = true;
      const holder = new THREE.Group();
      holder.rotation.z = lean;
      holder.add(seg);
      parent.add(holder);
      const top = new THREE.Group();
      top.position.y = segH;
      holder.add(top);
      parent = top;
      lean += 0.1;
    }

    // Fronds fan out from the crown, drooping outward and down.
    const frondMat = new THREE.MeshStandardMaterial({ color: 0x2E8B3D, flatShading: true, roughness: 0.85 });
    const frondGeo = new THREE.ConeGeometry(0.26, 1.7, 4);
    frondGeo.translate(0, 0.85, 0); // base at origin, tip extends along +Y
    const frondCount = 7;
    for (let i = 0; i < frondCount; i++) {
      const a = (i / frondCount) * Math.PI * 2;
      const holder = new THREE.Group();
      holder.rotation.y = a;
      const frond = new THREE.Mesh(frondGeo, frondMat);
      frond.scale.x = 0.34; // flatten into a blade
      frond.rotation.x = 1.05; // droop outward and down from the crown
      frond.castShadow = true;
      holder.add(frond);
      parent.add(holder);
    }

    // A few coconuts clustered under the crown — hidden and respawned when harvested.
    const nutMat = new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true, roughness: 0.85 });
    const coconutMeshes = [];
    for (let i = 0; i < 3; i++) {
      const a = i * 2.15;
      const nut = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), nutMat);
      nut.position.set(Math.cos(a) * 0.16, -0.05, Math.sin(a) * 0.16);
      nut.castShadow = true;
      parent.add(nut);
      coconutMeshes.push(nut);
    }

    group.userData.coconutMeshes = coconutMeshes;
    return group;
  }

  // ═══════════════════════════════════════════════
  //  WOODEN SHOP — small, windowless
  // ═══════════════════════════════════════════════
  function makeWoodenShop() {
    const group = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xC08A50, flatShading: true, roughness: 0.85 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x7B4F2B, flatShading: true, roughness: 0.85 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xE0B84B, flatShading: true, roughness: 0.9 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x4E3320, flatShading: true, roughness: 0.85 });

    const w = 1.6, h = 1.3, d = 1.4;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    body.position.y = h / 2;
    body.castShadow = true; body.receiveShadow = true;
    group.add(body);

    // Corner posts for a plank-built look — no window cutouts anywhere on the walls.
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, h + 0.15, 0.12), trimMat);
      post.position.set(sx * w / 2, (h + 0.15) / 2, sz * d / 2);
      post.castShadow = true;
      group.add(post);
    });

    // Pitched roof: two sloped panels meeting at a ridge.
    const roofPanelGeo = new THREE.BoxGeometry(w + 0.32, 0.1, d * 0.62);
    const roofL = new THREE.Mesh(roofPanelGeo, roofMat);
    roofL.position.set(0, h + 0.34, d * 0.16);
    roofL.rotation.x = 0.5;
    roofL.castShadow = true;
    const roofR = new THREE.Mesh(roofPanelGeo, roofMat);
    roofR.position.set(0, h + 0.34, -d * 0.16);
    roofR.rotation.x = -0.5;
    roofR.castShadow = true;
    group.add(roofL, roofR);
    const ridge = new THREE.Mesh(new THREE.BoxGeometry(w + 0.34, 0.14, 0.16), trimMat);
    ridge.position.set(0, h + 0.6, 0);
    group.add(ridge);

    // Door on the front face.
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.95, 0.05), doorMat);
    door.position.set(0, 0.475, d / 2 + 0.03);
    group.add(door);

    // Small awning over the doorway, reading as a shop counter rather than a window.
    const awning = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 0.5), trimMat);
    awning.position.set(0, h * 0.72, d / 2 + 0.28);
    awning.rotation.x = -0.15;
    awning.castShadow = true;
    group.add(awning);
    [-0.4, 0.4].forEach(sx => {
      const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6), trimMat);
      strut.position.set(sx, h * 0.55, d / 2 + 0.48);
      strut.rotation.x = 0.15;
      group.add(strut);
    });

    // Small hanging sign board.
    const sign = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.28, 0.04), trimMat);
    sign.position.set(0, h + 0.02, d / 2 + 0.06);
    group.add(sign);

    return group;
  }

  // ═══════════════════════════════════════════════
  //  CUBEY — the friendly cube waving hello. This is you.
  // ═══════════════════════════════════════════════
  function makeCubey() {
    const group = new THREE.Group();
    const cubeyMat = new THREE.MeshStandardMaterial({ color: 0xFFB74D, flatShading: true, roughness: 0.7 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), cubeyMat);
    body.position.y = 0.5;
    body.castShadow = true;
    group.add(body);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x2d2d2d });
    const faceBits = [];
    [-0.22, 0.22].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), eyeMat);
      eye.position.set(ex, 0.62, 0.49);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
      pupil.position.set(ex, 0.62, 0.58);
      group.add(eye, pupil);
      faceBits.push(eye, pupil);
    });

    const footMat = new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true });
    const footL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.36), footMat);
    const footR = footL.clone();
    footL.position.set(-0.25, 0.11, 0);
    footR.position.set(0.25, 0.11, 0);
    footL.castShadow = true; footR.castShadow = true;
    group.add(footL, footR);

    // Waving arm, pivoted at the shoulder so it can swing.
    const armPivot = new THREE.Group();
    armPivot.position.set(0.53, 0.78, 0.1);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.16), cubeyMat);
    arm.position.set(0, -0.25, 0);
    arm.castShadow = true;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), cubeyMat);
    hand.position.set(0, -0.5, 0);
    armPivot.add(arm, hand);
    group.add(armPivot);

    group.userData.armPivot = armPivot;
    group.userData.body = body;
    group.userData.faceBits = faceBits;
    group.userData.feet = [footL, footR];
    return group;
  }

  // ═══════════════════════════════════════════════
  //  SHOPKEEPER — a blue cube who runs the shop
  // ═══════════════════════════════════════════════
  function makeShopkeeper() {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x42A5F5, flatShading: true, roughness: 0.7 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
    body.position.y = 0.5;
    body.castShadow = true;
    group.add(body);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x2d2d2d });
    [-0.22, 0.22].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), eyeMat);
      eye.position.set(ex, 0.62, 0.49);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
      pupil.position.set(ex, 0.62, 0.58);
      group.add(eye, pupil);
    });

    const footMat = new THREE.MeshStandardMaterial({ color: 0x1E4E7A, flatShading: true });
    const footL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.36), footMat);
    const footR = footL.clone();
    footL.position.set(-0.25, 0.11, 0);
    footR.position.set(0.25, 0.11, 0);
    footL.castShadow = true; footR.castShadow = true;
    group.add(footL, footR);

    return group;
  }

  // ═══════════════════════════════════════════════
  //  PLACE THE SCENE
  // ═══════════════════════════════════════════════
  // Every coconut tree on the island is harvestable; new land grows more of them.
  const trees = []; // { group, x, z, ready, regrowAt, coconutMeshes }
  function addTree(x, z, randomYaw = false) {
    const group = makeCoconutTree();
    group.position.set(x, LAND_Y, z);
    if (randomYaw) group.rotation.y = Math.random() * Math.PI * 2;
    scene.add(group);
    const t = { group, x, z, ready: true, regrowAt: 0, coconutMeshes: group.userData.coconutMeshes };
    trees.push(t);
    return t;
  }

  const treePos = cellWorld(1, -2);
  addTree(treePos.x, treePos.z); // trees[0] — the intro tree with the "Hit!" marker

  const shop = makeWoodenShop();
  const shopPos = cellWorld(-1, -1);
  shop.position.set(shopPos.x, LAND_Y, shopPos.z);
  shop.rotation.y = 0.5;
  scene.add(shop);

  // The direction the shop's door faces — "in front of the shop" is out along this vector.
  const shopDoorDir = new THREE.Vector3(Math.sin(shop.rotation.y), 0, Math.cos(shop.rotation.y));
  const shopInsidePos = new THREE.Vector3(shopPos.x, LAND_Y, shopPos.z).addScaledVector(shopDoorDir, 0.3);
  const shopStandPos  = new THREE.Vector3(shopPos.x, LAND_Y, shopPos.z).addScaledVector(shopDoorDir, 1.2);

  const SHOPKEEPER_SCALE = 0.65; // smaller than CUBEY, so he fits his little shop
  const shopkeeper = makeShopkeeper();
  shopkeeper.scale.setScalar(SHOPKEEPER_SCALE);
  shopkeeper.position.copy(shopInsidePos);
  shopkeeper.rotation.y = Math.PI + shop.rotation.y; // face outward, toward the door direction
  shopkeeper.visible = false;
  scene.add(shopkeeper);

  const cubey = makeCubey(); // cubey doubles as the player once first-person begins
  const cubeyPos = cellWorld(0, 1);
  cubey.position.set(cubeyPos.x, LAND_Y, cubeyPos.z);
  cubey.rotation.y = -0.3; // his face (+Z) and waving arm (+X) both sit toward the camera by default
  scene.add(cubey);

  const player = cubey; // clearer name for the movement code below

  // Soft contact shadow so the player still reads as grounded once his body is hidden.
  const shadowBlob = new THREE.Mesh(
    new THREE.CircleGeometry(0.5, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false })
  );
  shadowBlob.rotation.x = -Math.PI / 2;
  shadowBlob.visible = false;
  scene.add(shadowBlob);

  // ═══════════════════════════════════════════════
  //  PROPS & ANIMALS — spawned on newly purchased land
  // ═══════════════════════════════════════════════
  function makeBamboo() {
    const g = new THREE.Group();
    const stalkMat = new THREE.MeshStandardMaterial({ color: 0x8BC34A, flatShading: true, roughness: 0.8 });
    const nodeMat  = new THREE.MeshStandardMaterial({ color: 0x689F38, flatShading: true, roughness: 0.8 });
    const count = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const h = 1.8 + Math.random() * 1.6;
      const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.075, h, 5), stalkMat);
      const px = (Math.random() - 0.5) * 0.9, pz = (Math.random() - 0.5) * 0.9;
      stalk.position.set(px, h / 2, pz);
      stalk.rotation.z = (Math.random() - 0.5) * 0.12;
      stalk.castShadow = true;
      g.add(stalk);
      for (const frac of [0.35, 0.7]) { // node rings give it the segmented bamboo look
        const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.05, 5), nodeMat);
        ring.position.set(px, h * frac, pz);
        g.add(ring);
      }
    }
    return g;
  }

  function makeBarn() {
    const g = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xC62828, flatShading: true, roughness: 0.85 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0xF5F0E8, flatShading: true, roughness: 0.85 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, flatShading: true, roughness: 0.9 });
    const w = 2.0, h = 1.4, d = 1.6;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    body.position.y = h / 2;
    body.castShadow = true; body.receiveShadow = true;
    g.add(body);
    const roofL = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.1, d * 0.65), roofMat);
    roofL.position.set(0, h + 0.32, d * 0.17);
    roofL.rotation.x = 0.5; roofL.castShadow = true;
    const roofR = roofL.clone();
    roofR.position.z = -d * 0.17; roofR.rotation.x = -0.5;
    g.add(roofL, roofR);
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.06), trimMat);
    door.position.set(0, 0.45, d / 2 + 0.03);
    g.add(door);
    const cross1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.07), wallMat);
    cross1.rotation.z = 0.65; cross1.position.set(0, 0.45, d / 2 + 0.07);
    const cross2 = cross1.clone(); cross2.rotation.z = -0.65;
    g.add(cross1, cross2);
    return g;
  }

  const beeHives = []; // { orbit } — animated in the render loop
  function makeBeehive() {
    const g = new THREE.Group();
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.8, 0.12),
      new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true })
    );
    post.position.y = 0.4; post.castShadow = true;
    const hive = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.45, 0.5),
      new THREE.MeshStandardMaterial({ color: 0xFFB300, flatShading: true, roughness: 0.8 })
    );
    hive.position.y = 1.0; hive.castShadow = true;
    const slot = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.05, 0.02),
      new THREE.MeshStandardMaterial({ color: 0x4E342E })
    );
    slot.position.set(0, 0.92, 0.26);
    g.add(post, hive, slot);

    const orbit = new THREE.Group();
    orbit.position.y = 1.1;
    const beeMat = new THREE.MeshStandardMaterial({ color: 0xFFEB3B, flatShading: true });
    for (let i = 0; i < 3; i++) {
      const bee = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), beeMat);
      const a = (i / 3) * Math.PI * 2;
      bee.position.set(Math.cos(a) * 0.55, (Math.random() - 0.5) * 0.2, Math.sin(a) * 0.55);
      orbit.add(bee);
    }
    g.add(orbit);
    beeHives.push({ orbit });
    return g;
  }

  const chickens = []; // { group, tx, tz, pauseUntil, phase }
  function makeChicken() {
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFAFAFA, flatShading: true, roughness: 0.8 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 0.5), bodyMat);
    body.position.y = 0.34; body.castShadow = true;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.24, 0.22), bodyMat);
    head.position.set(0, 0.62, 0.22); head.castShadow = true;
    const beak = new THREE.Mesh(
      new THREE.BoxGeometry(0.07, 0.06, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xFF9800, flatShading: true })
    );
    beak.position.set(0, 0.6, 0.38);
    const comb = new THREE.Mesh(
      new THREE.BoxGeometry(0.07, 0.1, 0.14),
      new THREE.MeshStandardMaterial({ color: 0xE53935, flatShading: true })
    );
    comb.position.set(0, 0.78, 0.22);
    const eyeMat2 = new THREE.MeshStandardMaterial({ color: 0x2d2d2d });
    [-0.12, 0.12].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), eyeMat2);
      eye.position.set(ex, 0.66, 0.3);
      g.add(eye);
    });
    const legMat = new THREE.MeshStandardMaterial({ color: 0xFF9800, flatShading: true });
    [-0.1, 0.1].forEach(lx => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.18, 0.05), legMat);
      leg.position.set(lx, 0.09, 0);
      g.add(leg);
    });
    g.add(body, head, beak, comb);
    return g;
  }

  function addChicken(x, z) {
    const group = makeChicken();
    group.position.set(x, LAND_Y, z);
    group.rotation.y = Math.random() * Math.PI * 2;
    scene.add(group);
    chickens.push({ group, tx: x, tz: z, pauseUntil: 0, phase: Math.random() * 10 });
  }

  const CHICKEN_SPEED = 0.9;
  function updateChickens(delta, t) {
    const now = performance.now();
    for (const c of chickens) {
      const g = c.group;
      const dx = c.tx - g.position.x, dz = c.tz - g.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.08) {
        if (!c.pauseUntil) c.pauseUntil = now + 700 + Math.random() * 2300;
        if (now > c.pauseUntil) {
          // wander somewhere nearby that's still on the island
          for (let tries = 0; tries < 6; tries++) {
            const a = Math.random() * Math.PI * 2;
            const r = 1.5 + Math.random() * 3;
            const nx = g.position.x + Math.cos(a) * r, nz = g.position.z + Math.sin(a) * r;
            if (isLand(nx, nz)) { c.tx = nx; c.tz = nz; break; }
          }
          c.pauseUntil = 0;
        }
      } else {
        const step = Math.min(CHICKEN_SPEED * delta, dist);
        g.position.x += (dx / dist) * step;
        g.position.z += (dz / dist) * step;
        g.rotation.y = Math.atan2(dx, dz);
        g.position.y = LAND_Y + Math.abs(Math.sin(t * 9 + c.phase)) * 0.05;
      }
    }
  }

  function updateBees(delta, t) {
    for (const h of beeHives) {
      h.orbit.rotation.y += delta * 1.6;
      h.orbit.children.forEach((bee, i) => {
        bee.position.y = Math.sin(t * 5 + i * 2.1) * 0.12;
      });
    }
  }

  // What each new patch of land gets, in order of purchase.
  let patchCounter = 0;
  function spawnPatchProps(newCells) {
    // Prefer interior cells (not on the new coastline) so props stay off the beach.
    const candidates = newCells.filter(c => !isCoast(c.gx, c.gz));
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    let idx = 0;
    const takeSpot = () => {
      if (idx >= candidates.length) return null;
      const c = candidates[idx++];
      const { x, z } = cellWorld(c.gx, c.gz);
      return { x: x + (Math.random() - 0.5) * 0.5, z: z + (Math.random() - 0.5) * 0.5 };
    };

    const plan = ['tree', 'bamboo', 'chicken'];
    if (Math.random() < 0.5) plan.push('tree');
    if (Math.random() < 0.5) plan.push('chicken');
    plan.push(['barn', 'hive', 'shop'][patchCounter % 3]); // one landmark per patch, cycling
    patchCounter++;

    for (const what of plan) {
      const spot = takeSpot();
      if (!spot) break;
      if (what === 'tree') addTree(spot.x, spot.z, true);
      else if (what === 'chicken') addChicken(spot.x, spot.z);
      else {
        const prop = what === 'bamboo' ? makeBamboo() : what === 'barn' ? makeBarn() : what === 'hive' ? makeBeehive() : makeWoodenShop();
        prop.position.set(spot.x, LAND_Y, spot.z);
        prop.rotation.y = Math.random() * Math.PI * 2;
        scene.add(prop);
      }
    }
  }

  // ═══════════════════════════════════════════════
  //  "HIT" MARKER — arrow + sign above the coconut tree
  // ═══════════════════════════════════════════════
  const glowPad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.1, 1.1, 0.06, 20),
    new THREE.MeshBasicMaterial({ color: 0xFFD54F, transparent: true, opacity: 0.5 })
  );
  glowPad.position.set(treePos.x, LAND_Y + 0.03, treePos.z);
  glowPad.visible = false;
  scene.add(glowPad);

  const markerGroup = new THREE.Group();
  markerGroup.position.set(treePos.x, LAND_Y + 1.2, treePos.z); // low, near eye level, so it stays in view
  markerGroup.visible = false;
  scene.add(markerGroup);

  const arrowGroup = new THREE.Group();
  const arrowHead = new THREE.Mesh(
    new THREE.ConeGeometry(0.45, 0.9, 6),
    new THREE.MeshStandardMaterial({ color: 0xFF7043, flatShading: true })
  );
  arrowHead.rotation.x = Math.PI;
  const arrowShaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 1.1, 6),
    new THREE.MeshStandardMaterial({ color: 0xFF7043, flatShading: true })
  );
  arrowShaft.position.y = 0.85;
  arrowHead.castShadow = true; arrowShaft.castShadow = true;
  arrowGroup.add(arrowHead, arrowShaft);
  arrowGroup.position.y = 1.0;
  markerGroup.add(arrowGroup);

  function makeTextSprite(text, opts = {}) {
    const { fontsize = 46, color = '#ffffff', bg = 'rgba(20,20,20,.75)' } = opts;
    const cvs = document.createElement('canvas');
    const ctx = cvs.getContext('2d');
    ctx.font = `800 ${fontsize}px 'Segoe UI', Arial, sans-serif`;
    const w = ctx.measureText(text).width + 48;
    const h = fontsize + 40;
    cvs.width = w; cvs.height = h;
    ctx.font = `800 ${fontsize}px 'Segoe UI', Arial, sans-serif`;
    ctx.fillStyle = bg;
    const r = 18;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
    ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath(); ctx.fill();
    ctx.fillStyle = color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, w / 2, h / 2 + 3);
    const tex = new THREE.CanvasTexture(cvs);
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, fog: false });
    const sprite = new THREE.Sprite(mat);
    const s = 0.012;
    sprite.scale.set(w * s, h * s, 1);
    return sprite;
  }

  const signSprite = makeTextSprite('Hit!', { color: '#FFD54F' });
  signSprite.position.y = 1.9;
  markerGroup.add(signSprite);

  // ═══════════════════════════════════════════════
  //  SHOP MARKER — a sideways arrow pointing at the shop, shown once the
  //  coconut tree's arrow has done its job and retired.
  // ═══════════════════════════════════════════════
  function makeSidewaysArrow(color) {
    // Built pointing along local +Z: for a plain Object3D (unlike a camera or light),
    // lookAt() swings its +Z axis toward the target, not -Z — so the tip has to live here.
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color, flatShading: true });
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.8, 6), mat);
    head.rotation.x = Math.PI / 2;
    head.position.z = 0.85;
    head.castShadow = true;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.9, 6), mat);
    shaft.rotation.x = Math.PI / 2;
    shaft.position.z = 0.35;
    shaft.castShadow = true;
    g.add(head, shaft);
    return g;
  }

  const shopGlowPad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.1, 1.1, 0.06, 20),
    new THREE.MeshBasicMaterial({ color: 0x64B5F6, transparent: true, opacity: 0.5 })
  );
  shopGlowPad.position.copy(shopStandPos).setY(LAND_Y + 0.03);
  shopGlowPad.visible = false;
  scene.add(shopGlowPad);

  // Placed off to the side (toward the tree, where CUBEY is coming from) rather than
  // straight along the approach path, so its profile reads as a clear sideways arrow
  // instead of being viewed end-on.
  const shopSidePerp = new THREE.Vector3(shopDoorDir.z, 0, -shopDoorDir.x);
  const shopMarkerGroup = new THREE.Group();
  const shopArrowAnchor = new THREE.Vector3(shopPos.x, LAND_Y + 1.4, shopPos.z).addScaledVector(shopSidePerp, 2.1);
  shopMarkerGroup.position.copy(shopArrowAnchor);
  shopMarkerGroup.lookAt(shopPos.x, LAND_Y + 1.4, shopPos.z);
  shopMarkerGroup.visible = false;
  scene.add(shopMarkerGroup);

  const shopArrow = makeSidewaysArrow(0x42A5F5);
  shopMarkerGroup.add(shopArrow);

  const shopSignSprite = makeTextSprite('Walk in front of the shop', { color: '#90CAF9' });
  shopSignSprite.position.y = 0.9;
  shopMarkerGroup.add(shopSignSprite);

  // ═══════════════════════════════════════════════
  //  RED BUY-LAND BUTTONS — one at each edge of the island; walk onto one
  //  and it buys the patch of land right there, next to that button.
  // ═══════════════════════════════════════════════
  const DIR_DEFS = {
    px: { dx: 1, dz: 0 }, nx: { dx: -1, dz: 0 },
    pz: { dx: 0, dz: 1 }, nz: { dx: 0, dz: -1 },
  };
  const extents = { px: ISLAND_R, nx: ISLAND_R, pz: ISLAND_R, nz: ISLAND_R };
  const expansions = { px: 0, nx: 0, pz: 0, nz: 0 };
  let totalLandPurchases = 0;
  function landPrice() { return LAND_PRICE_BASE + LAND_PRICE_STEP * totalLandPurchases; }

  const buyButtons = {}; // dir -> { group, sprite, x, z, wasNear }

  function makeBuyButtonGroup() {
    const g = new THREE.Group();
    const rim = new THREE.Mesh(
      new THREE.CylinderGeometry(0.72, 0.78, 0.1, 16),
      new THREE.MeshStandardMaterial({ color: 0x8E0000, flatShading: true, roughness: 0.7 })
    );
    rim.position.y = 0.05;
    const pad = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.55, 0.14, 16),
      new THREE.MeshStandardMaterial({ color: 0xE53935, flatShading: true, roughness: 0.5, emissive: 0x550000 })
    );
    pad.position.y = 0.12;
    rim.castShadow = true; pad.castShadow = true;
    g.add(rim, pad);
    return g;
  }

  function buttonCell(dir) {
    const d = DIR_DEFS[dir];
    return { gx: extents[dir] * d.dx, gz: extents[dir] * d.dz };
  }

  function placeBuyButton(dir) {
    let btn = buyButtons[dir];
    if (!btn) {
      btn = buyButtons[dir] = { group: makeBuyButtonGroup(), sprite: null, x: 0, z: 0, wasNear: false };
      scene.add(btn.group);
    }
    const { gx, gz } = buttonCell(dir);
    const { x, z } = cellWorld(gx, gz);
    btn.x = x; btn.z = z;
    btn.group.position.set(x, LAND_Y, z);
    btn.wasNear = false;
  }

  function removeBuyButton(dir) {
    const btn = buyButtons[dir];
    if (!btn) return;
    scene.remove(btn.group);
    delete buyButtons[dir];
  }

  function refreshButtonSprites() {
    for (const dir of Object.keys(buyButtons)) {
      const btn = buyButtons[dir];
      if (btn.sprite) {
        btn.group.remove(btn.sprite);
        btn.sprite.material.map.dispose();
        btn.sprite.material.dispose();
      }
      btn.sprite = makeTextSprite(`Buy land · ${landPrice()} 🪙`, { color: '#FF8A80' });
      btn.sprite.position.y = 1.5;
      btn.group.add(btn.sprite);
    }
  }

  for (const dir of Object.keys(DIR_DEFS)) placeBuyButton(dir);
  refreshButtonSprites();
  Object.values(buyButtons).forEach(b => (b.group.visible = false)); // shown after the first coconut harvest

  function buyLandAt(dir) {
    const price = landPrice();
    if (cubeCoins < price) { toast(`You need ${price} cubecoins to buy this land`, false); return; }
    cubeCoins -= price;
    totalLandPurchases++;
    expansions[dir]++;

    const d = DIR_DEFS[dir];
    const e = extents[dir];
    const newCells = [];
    for (let depth = 1; depth <= PATCH_DEPTH; depth++) {
      for (let w = -PATCH_HALFW; w <= PATCH_HALFW; w++) {
        const gx = d.dx !== 0 ? (e + depth) * d.dx : w;
        const gz = d.dz !== 0 ? (e + depth) * d.dz : w;
        if (!landSet.has(cellKey(gx, gz))) {
          landSet.add(cellKey(gx, gz));
          newCells.push({ gx, gz });
        }
      }
    }
    extents[dir] += PATCH_DEPTH;

    rebuildIslandMeshes();
    spawnPatchProps(newCells);

    if (expansions[dir] >= MAX_EXPANSIONS_PER_DIR) removeBuyButton(dir);
    else placeBuyButton(dir);
    refreshButtonSprites();
    refreshInventory();
    toast(`Land purchased for ${price} 🪙!`, true);
  }

  function updateBuyButtons() {
    if (!treeIntroduced) return; // buttons only exist for the player after the first harvest
    for (const dir of Object.keys(buyButtons)) {
      const btn = buyButtons[dir];
      const dist = Math.hypot(player.position.x - btn.x, player.position.z - btn.z);
      if (dist <= BUTTON_RANGE) {
        if (!btn.wasNear) {
          btn.wasNear = true; // one attempt per visit — step away and back to retry
          buyLandAt(dir);
        }
      } else if (dist > BUTTON_RANGE + 0.8) {
        btn.wasNear = false;
      }
    }
  }

  // ═══════════════════════════════════════════════
  //  COCONUT HARVEST — hit the tree, coconuts fall, inventory grows
  // ═══════════════════════════════════════════════
  let coconutCount = 0;
  let cubeCoins = 0;
  let harvestEnabled = false; // becomes true once the intro→fps transition completes
  let treeIntroduced = false; // once true, the intro tree's arrow retires for good
  const fallingCoconuts = []; // { mesh, vel, bounces }
  const nutMat2 = new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true, roughness: 0.85 });

  const inventoryEl = document.getElementById('inventory');
  const coconutCountEl = document.getElementById('coconut-count');
  const coinCountEl = document.getElementById('coin-count');
  const hitPromptEl = document.getElementById('hit-prompt');
  const hitBtnEl = document.getElementById('hit-btn');
  const toastEl = document.getElementById('toast');

  function refreshInventory() {
    coconutCountEl.textContent = coconutCount;
    coinCountEl.textContent = cubeCoins;
  }

  let toastTimer;
  function toast(msg, ok) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.style.background = ok ? 'rgba(46,125,50,.92)' : 'rgba(198,40,40,.92)';
    toastEl.style.opacity = '1';
    toastTimer = setTimeout(() => (toastEl.style.opacity = '0'), 2200);
  }

  let targetTree = null; // the nearest ready tree within reach, if any

  function findTargetTree() {
    if (!harvestEnabled) return null;
    let best = null, bestDist = HIT_RANGE;
    for (const t of trees) {
      if (!t.ready) continue;
      const d = Math.hypot(player.position.x - t.x, player.position.z - t.z);
      if (d <= bestDist) { best = t; bestDist = d; }
    }
    return best;
  }

  function hitTree() {
    const t = targetTree;
    if (!t) return;
    t.ready = false;
    t.regrowAt = performance.now() + REGROW_MS;
    t.coconutMeshes.forEach(m => (m.visible = false));
    if (t === trees[0]) { glowPad.visible = false; markerGroup.visible = false; }

    for (let i = 0; i < 3; i++) {
      const nut = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), nutMat2);
      nut.position.set(
        t.x + (Math.random() - 0.5) * 0.3,
        LAND_Y + CROWN_HEIGHT - 0.2,
        t.z + (Math.random() - 0.5) * 0.3
      );
      nut.castShadow = true;
      scene.add(nut);
      fallingCoconuts.push({
        mesh: nut,
        vel: new THREE.Vector3((Math.random() - 0.5) * 1.6, 0.5, (Math.random() - 0.5) * 1.6),
        bounces: 0,
        settleAt: 0,
      });
    }

    coconutCount += 3;
    refreshInventory();

    // The intro tree's "Hit!" marker has done its job — retire it for good, and
    // point the player at the shop instead. The red buy-land buttons appear too.
    if (!treeIntroduced) {
      treeIntroduced = true;
      shopMarkerGroup.visible = true;
      shopGlowPad.visible = true;
      Object.values(buyButtons).forEach(b => (b.group.visible = true));
    }
  }

  function updateFallingCoconuts(delta) {
    const now = performance.now();
    for (let i = fallingCoconuts.length - 1; i >= 0; i--) {
      const fc = fallingCoconuts[i];
      const m = fc.mesh;
      if (fc.settleAt) {
        if (now > fc.settleAt) {
          scene.remove(m);
          fallingCoconuts.splice(i, 1);
        }
        continue;
      }
      fc.vel.y -= 9.8 * delta;
      m.position.addScaledVector(fc.vel, delta);
      const groundY = LAND_Y + 0.13;
      if (m.position.y <= groundY) {
        m.position.y = groundY;
        if (fc.bounces < 2 && Math.abs(fc.vel.y) > 0.6) {
          fc.vel.y = -fc.vel.y * 0.4;
          fc.vel.x *= 0.6; fc.vel.z *= 0.6;
          fc.bounces++;
        } else {
          fc.vel.set(0, 0, 0);
          fc.settleAt = now + 1800; // leave it lying on the ground briefly, then remove
        }
      }
    }
  }

  // ═══════════════════════════════════════════════
  //  SHOPKEEPER — walks out when CUBEY steps in front of the shop, and sells
  // ═══════════════════════════════════════════════
  const speechBubbleEl = document.getElementById('speech-bubble');
  const speechTextEl = document.getElementById('speech-text');
  const speechButtonsEl = document.getElementById('speech-buttons');

  let shopState = 'inside'; // 'inside' | 'walking_out' | 'out' | 'walking_in'
  let shopAnimT0 = 0;
  let dialogMode = null;     // null | 'prompt' | 'message'
  let dialogRevertAt = 0;
  let nearShop = false;

  function showPrompt() {
    dialogMode = 'prompt';
    speechTextEl.textContent = 'What do you want to sell?';
    speechButtonsEl.style.display = 'flex';
  }

  function showMessage(text, revertMs = 1900) {
    dialogMode = 'message';
    speechTextEl.textContent = text;
    speechButtonsEl.style.display = 'none';
    dialogRevertAt = performance.now() + revertMs;
  }

  function shopEnter() {
    if (shopState !== 'inside') return;
    shopkeeper.visible = true;
    shopkeeper.position.copy(shopInsidePos);
    shopAnimT0 = performance.now();
    shopState = 'walking_out';
  }

  function shopExit() {
    if (shopState !== 'out' && shopState !== 'walking_out') return;
    dialogMode = null;
    speechBubbleEl.classList.remove('show');
    shopAnimT0 = performance.now();
    shopState = 'walking_in';
  }

  function sellAll() {
    if (coconutCount <= 0) { showMessage('Sorry, you have nothing to sell.'); return; }
    const sold = coconutCount, earned = sold * COCONUT_PRICE;
    coconutCount = 0;
    cubeCoins += earned;
    refreshInventory();
    showMessage(`Sold ${sold} coconuts for ${earned} cubecoins!`);
  }

  function sellHand() {
    if (coconutCount <= 0) { showMessage('Sorry, you have nothing in your hand.'); return; }
    coconutCount -= 1;
    cubeCoins += COCONUT_PRICE;
    refreshInventory();
    showMessage(`Sold 1 coconut for ${COCONUT_PRICE} cubecoins!`);
  }

  speechButtonsEl.addEventListener('click', e => {
    const action = e.target.dataset.action;
    if (action === 'all') sellAll();
    else if (action === 'hand') sellHand();
    else if (action === 'cancel') shopExit();
  });

  function worldToScreen(vec3) {
    const v = vec3.clone().project(fpsCamera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, behind: v.z > 1 };
  }

  const shopHeadOffset = new THREE.Vector3(0, 1.15 * SHOPKEEPER_SCALE, 0);
  function updateShopkeeper(delta) {
    if (shopState === 'walking_out' || shopState === 'walking_in') {
      const tt = Math.min((performance.now() - shopAnimT0) / SHOP_WALK_MS, 1);
      const ease = tt * tt * (3 - 2 * tt);
      if (shopState === 'walking_out') shopkeeper.position.lerpVectors(shopInsidePos, shopStandPos, ease);
      else shopkeeper.position.lerpVectors(shopStandPos, shopInsidePos, ease);
      if (tt >= 1) {
        if (shopState === 'walking_out') { shopState = 'out'; showPrompt(); }
        else { shopState = 'inside'; shopkeeper.visible = false; }
      }
    }

    if (dialogMode === 'message' && performance.now() > dialogRevertAt) {
      if (shopState === 'out') showPrompt();
      else dialogMode = null;
    }

    const showBubble = shopState === 'out' && dialogMode !== null;
    speechBubbleEl.classList.toggle('show', showBubble);
    if (showBubble) {
      const head = shopkeeper.position.clone().add(shopHeadOffset);
      const s = worldToScreen(head);
      if (!s.behind) {
        speechBubbleEl.style.left = `${s.x}px`;
        speechBubbleEl.style.top = `${s.y - 14}px`;
      }
    }

    // Walking away mid-conversation politely ends it.
    if ((shopState === 'out') && !nearShop) shopExit();
  }

  // ═══════════════════════════════════════════════
  //  INTRO → FIRST PERSON TRANSITION
  // ═══════════════════════════════════════════════
  const fadeEl = document.getElementById('fade');
  const startPromptEl = document.getElementById('start-prompt');

  let phase = 'intro'; // 'intro' -> 'fps'

  setTimeout(() => startPromptEl.classList.add('show'), 1500);

  function beginFirstPerson() {
    if (phase !== 'intro') return;
    phase = 'transitioning';
    startPromptEl.classList.remove('show');

    fadeEl.classList.add('show');
    setTimeout(() => {
      activeCamera = fpsCamera;
      activeCamera.aspect = innerWidth / innerHeight;
      activeCamera.updateProjectionMatrix();

      player.userData.body.visible = false;
      player.userData.faceBits.forEach(o => (o.visible = false));
      shadowBlob.visible = true;

      harvestEnabled = true;
      glowPad.visible = true;
      markerGroup.visible = true;

      phase = 'fps';
      inventoryEl.classList.add('show');

      fadeEl.classList.remove('show');
    }, 380);
  }

  startPromptEl.addEventListener('click', beginFirstPerson);
  window.addEventListener('keydown', e => { if (phase === 'intro' && e.key === 'Enter') beginFirstPerson(); });

  // ═══════════════════════════════════════════════
  //  LOOK — click-and-drag mouse (no Pointer Lock API, so it works even in
  //  sandboxed embeds that don't grant it), plus dedicated arrow-key turning.
  // ═══════════════════════════════════════════════
  const MOUSE_SENS = 0.0035;
  let dragging = false, dragLast = { x: 0, y: 0 };

  canvas.addEventListener('mousedown', e => {
    if (isTouch || phase !== 'fps') return;
    dragging = true;
    dragLast = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - dragLast.x, dy = e.clientY - dragLast.y;
    yaw   -= dx * MOUSE_SENS;
    pitch  = THREE.MathUtils.clamp(pitch - dy * MOUSE_SENS, -PITCH_LIMIT, PITCH_LIMIT);
    dragLast = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  // ═══════════════════════════════════════════════
  //  INPUT — keyboard + touch joystick/look + Hit
  // ═══════════════════════════════════════════════
  const keys = new Set();
  window.addEventListener('keydown', e => {
    keys.add(e.key.toLowerCase());
    if (e.key.toLowerCase() === 'e') hitTree();
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

  function readKeyboardVector() {
    let x = 0, z = 0;
    if (keys.has('w')) z += 1;
    if (keys.has('s')) z -= 1;
    if (keys.has('a')) x -= 1;
    if (keys.has('d')) x += 1;
    return { x, z };
  }

  // Arrow keys turn CUBEY around (left/right) and look up/down — a mouse-free
  // way to turn, on top of the click-and-drag look above.
  const TURN_SPEED = 2.0;
  const LOOK_SPEED = 1.4;
  function applyKeyboardTurn(delta) {
    if (keys.has('arrowleft'))  yaw += TURN_SPEED * delta;
    if (keys.has('arrowright')) yaw -= TURN_SPEED * delta;
    if (keys.has('arrowup'))    pitch = THREE.MathUtils.clamp(pitch + LOOK_SPEED * delta, -PITCH_LIMIT, PITCH_LIMIT);
    if (keys.has('arrowdown'))  pitch = THREE.MathUtils.clamp(pitch - LOOK_SPEED * delta, -PITCH_LIMIT, PITCH_LIMIT);
  }

  const touchMove = { x: 0, z: 0 };
  const joyZone = document.getElementById('joy-zone');
  const joyKnob = document.getElementById('joy-knob');
  let joyActive = false, joyId = null, joyCenter = { x: 0, y: 0 };
  const JOY_RADIUS = 46;

  function joyStart(e) {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    joyId = t.identifier ?? 'mouse';
    const r = joyZone.getBoundingClientRect();
    joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    joyActive = true;
    joyMove(e);
  }
  function joyMove(e) {
    if (!joyActive) return;
    const list = e.changedTouches || [e];
    let t = null;
    for (const cand of list) { if ((cand.identifier ?? 'mouse') === joyId) t = cand; }
    if (!t) return;
    let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
    const len = Math.hypot(dx, dy) || 1;
    const clamped = Math.min(len, JOY_RADIUS);
    dx = (dx / len) * clamped; dy = (dy / len) * clamped;
    joyKnob.style.left = `calc(50% + ${dx}px)`;
    joyKnob.style.top  = `calc(50% + ${dy}px)`;
    touchMove.x = dx / JOY_RADIUS;
    touchMove.z = -dy / JOY_RADIUS;
  }
  function joyEnd() {
    joyActive = false; joyId = null;
    touchMove.x = 0; touchMove.z = 0;
    joyKnob.style.left = '50%'; joyKnob.style.top = '50%';
  }
  joyZone.addEventListener('touchstart', joyStart, { passive: true });
  joyZone.addEventListener('touchmove', joyMove, { passive: true });
  joyZone.addEventListener('touchend', joyEnd);
  joyZone.addEventListener('touchcancel', joyEnd);

  const TOUCH_SENS = 0.0055;
  let lookTouchId = null, lookLast = { x: 0, y: 0 };
  canvas.addEventListener('touchstart', e => {
    if (phase === 'intro') { beginFirstPerson(); return; }
    for (const t of e.changedTouches) {
      if (lookTouchId === null) { lookTouchId = t.identifier; lookLast = { x: t.clientX, y: t.clientY }; }
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
        yaw -= dx * TOUCH_SENS;
        pitch = THREE.MathUtils.clamp(pitch - dy * TOUCH_SENS, -PITCH_LIMIT, PITCH_LIMIT);
        lookLast = { x: t.clientX, y: t.clientY };
      }
    }
  }, { passive: true });
  function lookTouchEnd(e) {
    for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
  }
  canvas.addEventListener('touchend', lookTouchEnd);
  canvas.addEventListener('touchcancel', lookTouchEnd);

  hitBtnEl.addEventListener('click', hitTree);

  // ═══════════════════════════════════════════════
  //  RESIZE
  // ═══════════════════════════════════════════════
  window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    updateIntroFrustum();
    fpsCamera.aspect = innerWidth / innerHeight;
    fpsCamera.updateProjectionMatrix();
  });

  // ═══════════════════════════════════════════════
  //  RENDER LOOP
  // ═══════════════════════════════════════════════
  const clock = new THREE.Clock();
  const armPivot = cubey.userData.armPivot;
  let walkCycle = 0;

  function updatePlayer(delta) {
    const kb = readKeyboardVector();
    const ix = THREE.MathUtils.clamp(kb.x + touchMove.x, -1, 1);
    const iz = THREE.MathUtils.clamp(kb.z + touchMove.z, -1, 1);
    const moving = Math.hypot(ix, iz) > 0.05;

    if (moving) {
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right   = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const dir = forward.multiplyScalar(iz).add(right.multiplyScalar(ix));
      if (dir.length() > 1) dir.normalize();

      const step = PLAYER_SPEED * delta;
      const nx = player.position.x + dir.x * step;
      const nz = player.position.z + dir.z * step;
      if (isLand(nx, player.position.z)) player.position.x = nx;
      if (isLand(player.position.x, nz)) player.position.z = nz;
      walkCycle += delta * 9;
    } else {
      walkCycle *= 0.9;
    }

    player.rotation.y = yaw;
    const feet = player.userData.feet;
    feet[0].position.y = 0.11 + Math.max(0, Math.sin(walkCycle)) * 0.08;
    feet[1].position.y = 0.11 + Math.max(0, -Math.sin(walkCycle)) * 0.08;
    shadowBlob.position.set(player.position.x, LAND_Y + 0.02, player.position.z);

    targetTree = findTargetTree();
    hitPromptEl.classList.toggle('show', !!targetTree && !isTouch);
    hitBtnEl.classList.toggle('ready', !!targetTree && isTouch);
    updateBuyButtons();

    if (treeIntroduced) {
      const sdx = player.position.x - shopPos.x, sdz = player.position.z - shopPos.z;
      const sdist = Math.hypot(sdx, sdz);
      const facing = (sdx * shopDoorDir.x + sdz * shopDoorDir.z) / (sdist || 1);
      nearShop = sdist <= SHOP_RANGE && facing > 0.3; // roughly in front of the door, not behind it
      if (nearShop) shopEnter();
    }
  }

  function updateFpsCamera() {
    fpsCamera.rotation.set(pitch, yaw, 0, 'YXZ');
    fpsCamera.position.set(player.position.x, player.position.y + EYE_HEIGHT, player.position.z);
  }

  function loop() {
    requestAnimationFrame(loop);
    const delta = Math.min(clock.getDelta(), 0.1);
    const t = clock.getElapsedTime();

    updateOcean(t);

    if (phase === 'intro' || phase === 'transitioning') {
      armPivot.rotation.z = 2.75 + Math.sin(t * 5) * 0.35;
    } else if (phase === 'fps') {
      applyKeyboardTurn(delta);
      updatePlayer(delta);
      updateFpsCamera();
      fpsCamera.updateMatrixWorld(); // so worldToScreen below reflects this frame's look direction
      updateFallingCoconuts(delta);
      updateShopkeeper(delta);

      const now = performance.now();
      for (const tr of trees) {
        if (!tr.ready && now > tr.regrowAt) {
          tr.ready = true;
          tr.coconutMeshes.forEach(m => (m.visible = true));
          if (tr === trees[0]) {
            glowPad.visible = true;
            if (!treeIntroduced) markerGroup.visible = true;
          }
        }
      }
      glowPad.material.opacity = 0.4 + Math.sin(t * 3) * 0.15;
      arrowGroup.position.y = 1.0 + Math.sin(t * 2.2) * 0.25;
      markerGroup.rotation.y += delta * 0.6;

      updateChickens(delta, t);
      updateBees(delta, t);

      if (shopMarkerGroup.visible) {
        shopGlowPad.material.opacity = 0.4 + Math.sin(t * 3) * 0.15;
        shopArrow.position.x = Math.sin(t * 2.2) * 0.25; // sideways bob, matching its horizontal pose
      }
    }

    renderer.render(scene, activeCamera);
  }
  loop();
  </script>
</body>
</html>
