<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Tycoon 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
    canvas { display: block; }

    /* ── HUD ─────────────────────────────── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.12);
      z-index: 100;
    }
    .stat { display: flex; align-items: center; gap: 10px; color: #fff; }
    .stat-icon { font-size: 22px; }
    .stat-value { font-size: 22px; font-weight: 700; color: #FFD700; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,.55); }
    #game-title { color: #fff; text-align: center; }
    #game-title h1 { font-size: 20px; letter-spacing: 1px; }
    #game-title p  { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }

    /* ── TOOLBAR ─────────────────────────── */
    #toolbar {
      position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100;
    }
    .tool-btn {
      padding: 7px 14px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.2);
      background: rgba(0,0,0,.45); backdrop-filter: blur(8px);
      color: #fff; font-size: 13px; cursor: pointer; user-select: none;
      transition: all .18s;
    }
    .tool-btn:hover { background: rgba(255,255,255,.15); }
    .tool-btn.active { border-color: #FF5722; background: rgba(255,87,34,.25); color: #FF8A65; }

    /* ── BUILDING PANEL ───────────────────── */
    #building-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex; gap: 10px; justify-content: center;
      overflow-x: auto;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,.12);
      z-index: 100;
    }
    .bld-btn {
      display: flex; flex-direction: column; align-items: center;
      padding: 9px 13px; border-radius: 12px; min-width: 85px;
      border: 2px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: #fff; cursor: pointer; user-select: none;
      transition: all .18s;
    }
    .bld-btn:hover { background: rgba(255,255,255,.15); transform: translateY(-3px); }
    .bld-btn.selected { border-color: #FFD700; background: rgba(255,215,0,.18); }
    .bld-btn.cant-afford { opacity: .4; }
    .bld-icon  { font-size: 26px; margin-bottom: 3px; }
    .bld-name  { font-size: 10px; font-weight: 700; }
    .bld-cost  { font-size: 10px; color: #FFD700; }
    .bld-inc   { font-size: 10px; color: #69F0AE; }

    /* ── INFO CARD ───────────────────────── */
    #info-card {
      position: fixed; top: 115px; right: 18px;
      width: 195px; padding: 14px;
      background: rgba(0,0,0,.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
      color: #fff; z-index: 100; display: none;
    }
    #info-card h3 { font-size: 14px; margin-bottom: 6px; }
    #info-card p  { font-size: 12px; color: rgba(255,255,255,.65); margin: 3px 0; }
    #info-card .highlight { color: #FFD700; font-weight: 700; }

    /* ── STATS CARD ──────────────────────── */
    #stats-card {
      position: fixed; top: 115px; left: 18px;
      width: 165px; padding: 14px;
      background: rgba(0,0,0,.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
      color: #fff; z-index: 100;
    }
    #stats-card h3 { font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
    .stat-row span:last-child { color: #FFD700; font-weight: 700; }

    /* ── TOAST ───────────────────────────── */
    #toast {
      position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
      padding: 9px 20px; border-radius: 9px; font-size: 13px; font-weight: 600;
      color: #fff; z-index: 200; opacity: 0;
      transition: opacity .3s; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="stat">
      <span class="stat-icon">💰</span>
      <div>
        <div class="stat-value" id="money">$1,000</div>
        <div class="stat-label">Balance</div>
      </div>
    </div>
    <div id="game-title"><h1>🏙️ City Tycoon 3D</h1><p>Build your empire</p></div>
    <div class="stat">
      <span class="stat-icon">📈</span>
      <div>
        <div class="stat-value" id="income">$0/s</div>
        <div class="stat-label">Income</div>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button class="tool-btn" id="btn-bulldoze">🔨 Bulldoze</button>
    <button class="tool-btn" id="btn-clear">🧹 Clear All</button>
  </div>

  <div id="stats-card">
    <h3>City Stats</h3>
    <div class="stat-row"><span>Buildings</span><span id="s-buildings">0</span></div>
    <div class="stat-row"><span>Earned total</span><span id="s-earned">$0</span></div>
    <div class="stat-row"><span>Time played</span><span id="s-time">0s</span></div>
  </div>

  <div id="info-card">
    <h3 id="ic-name">Building</h3>
    <p id="ic-desc">Description</p>
    <p>Cost: <span class="highlight" id="ic-cost">$0</span></p>
    <p>Income: <span class="highlight" id="ic-income">+$0/s</span></p>
    <p>ROI: <span class="highlight" id="ic-roi">—</span></p>
  </div>

  <div id="building-panel"></div>
  <div id="toast"></div>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ═══════════════════════════════════════════════
  //  CONFIG
  // ═══════════════════════════════════════════════
  const GRID  = 14;
  const CELL  = 3;
  const HALF  = (GRID * CELL) / 2;

  const DEFS = {
    house:      { name:'House',       icon:'🏠', cost:100,    income:1,    color:0x66BB6A, accent:0xE53935, h:1.4, desc:'A cozy home for your citizens.' },
    shop:       { name:'Shop',        icon:'🏪', cost:500,    income:6,    color:0x42A5F5, accent:0xFB8C00, h:2.0, desc:'Local retail, brings steady trade.' },
    park:       { name:'Park',        icon:'🌳', cost:200,    income:2,    color:0x26A69A, accent:0x1B5E20, h:0.3, desc:'Green space boosts city morale.' },
    factory:    { name:'Factory',     icon:'🏭', cost:2000,   income:25,   color:0x8D6E63, accent:0x546E7A, h:2.5, desc:'Industrial engine of growth.' },
    hotel:      { name:'Hotel',       icon:'🏨', cost:8000,   income:100,  color:0xAB47BC, accent:0x6A1B9A, h:4.5, desc:'Luxury lodging attracts tourists.' },
    bank:       { name:'Bank',        icon:'🏦', cost:25000,  income:300,  color:0xFFB300, accent:0xE65100, h:3.2, desc:'The city\'s financial heart.' },
    tower:      { name:'Skyscraper',  icon:'🏢', cost:80000,  income:1000, color:0x26C6DA, accent:0x006064, h:9.0, desc:'A towering downtown landmark.' },
    stadium:    { name:'Stadium',     icon:'🏟️', cost:250000, income:3000, color:0xEF5350, accent:0x880E4F, h:2.2, desc:'Sports & entertainment colosseum.' },
    casino:     { name:'Casino',      icon:'🎰', cost:800000, income:10000,color:0xFFD700, accent:0xF57F17, h:5.5, desc:'High-stakes luxury destination.' },
  };

  // ═══════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════
  const state = {
    money:      1000,
    income:     0,
    earned:     0,
    seconds:    0,
    buildings:  0,
    selected:   'house',
    bulldoze:   false,
    grid:       {},   // "gx,gz" → THREE.Group
  };

  // ═══════════════════════════════════════════════
  //  RENDERER / SCENE
  // ═══════════════════════════════════════════════
  const canvas   = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x87CEEB);

  const scene = new THREE.Scene();
  scene.fog   = new THREE.Fog(0x87CEEB, 80, 160);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 500);
  camera.position.set(38, 50, 38);
  camera.lookAt(0, 0, 0);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping  = true;
  controls.dampingFactor  = 0.06;
  controls.maxPolarAngle  = Math.PI / 2.15;
  controls.minDistance    = 15;
  controls.maxDistance    = 90;

  // ═══════════════════════════════════════════════
  //  LIGHTS
  // ═══════════════════════════════════════════════
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));

  const sun = new THREE.DirectionalLight(0xFFF8DC, 1.3);
  sun.position.set(25, 45, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  Object.assign(sc, { near:0.5, far:200, left:-50, right:50, top:50, bottom:-50 });
  scene.add(sun);

  // Fill from opposite side
  const fill = new THREE.DirectionalLight(0xB3E5FC, 0.35);
  fill.position.set(-20, 20, -15);
  scene.add(fill);

  // ═══════════════════════════════════════════════
  //  GROUND & GRID
  // ═══════════════════════════════════════════════
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c59 });
  const ground    = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // City plot (slightly lighter)
  const plotMat = new THREE.MeshLambertMaterial({ color: 0x5a8a68 });
  const plot    = new THREE.Mesh(new THREE.PlaneGeometry(GRID * CELL, GRID * CELL), plotMat);
  plot.rotation.x = -Math.PI / 2;
  plot.position.y  = 0.01;
  plot.receiveShadow = true;
  scene.add(plot);

  // Road grid overlay
  const gridHelper = new THREE.GridHelper(GRID * CELL, GRID, 0x000000, 0x000000);
  gridHelper.position.y = 0.03;
  gridHelper.material.opacity     = 0.12;
  gridHelper.material.transparent = true;
  scene.add(gridHelper);

  // Hover tile
  const hoverMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(CELL - 0.15, CELL - 0.15),
    new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.45, depthWrite: false })
  );
  hoverMesh.rotation.x = -Math.PI / 2;
  hoverMesh.position.y = 0.06;
  hoverMesh.visible    = false;
  scene.add(hoverMesh);

  // ═══════════════════════════════════════════════
  //  ENVIRONMENT DECOR
  // ═══════════════════════════════════════════════

  // Mountains
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const r = 65 + Math.random() * 20;
    const h = 12 + Math.random() * 18;
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(9 + Math.random() * 6, h, 7),
      new THREE.MeshLambertMaterial({ color: 0x455A64 })
    );
    m.position.set(Math.cos(a) * r, h / 2 - 2, Math.sin(a) * r);
    scene.add(m);
    // Snow cap
    const snow = new THREE.Mesh(
      new THREE.ConeGeometry(3, h * 0.25, 7),
      new THREE.MeshLambertMaterial({ color: 0xECEFF1 })
    );
    snow.position.set(Math.cos(a) * r, h - h * 0.1, Math.sin(a) * r);
    scene.add(snow);
  }

  // Perimeter trees
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = HALF + 5 + Math.random() * 12;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const h = 1.8 + Math.random() * 2.5;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.22, 0.9, 6),
      new THREE.MeshLambertMaterial({ color: 0x5D4037 })
    );
    trunk.position.set(x, 0.45, z);
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(0.9, h, 7),
      new THREE.MeshLambertMaterial({ color: 0x1B5E20 + (Math.random() * 0x0A1010 | 0) })
    );
    leaves.position.set(x, 0.9 + h / 2, z);
    scene.add(trunk, leaves);
  }

  // Clouds
  const cloudGroup = new THREE.Group();
  scene.add(cloudGroup);

  function makeCloud(x, y, z, scale = 1) {
    const g  = new THREE.Group();
    const m  = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
    [[0,0,0,1],[1.3,.3,0,.8],[-.9,.35,0,.7],[.5,.55,0,.65],[-.4,.5,.4,.6]].forEach(([px,py,pz,s]) => {
      const sphere = new THREE.Mesh(new THREE.SphereGeometry((0.9 + Math.random() * .3) * scale, 8, 8), m);
      sphere.position.set(px * scale, py * scale, pz * scale);
      g.add(sphere);
    });
    g.position.set(x, y, z);
    cloudGroup.add(g);
    return g;
  }

  const clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      mesh: makeCloud((Math.random() - .5) * 100, 22 + Math.random() * 14, (Math.random() - .5) * 100, .8 + Math.random() * .6),
      speed: (0.008 + Math.random() * 0.012) * (Math.random() < .5 ? 1 : -1)
    });
  }

  // ═══════════════════════════════════════════════
  //  BUILDING FACTORY
  // ═══════════════════════════════════════════════
  function makeBuilding(type, gx, gz) {
    const d   = DEFS[type];
    const grp = new THREE.Group();
    const bw  = CELL * 0.78;

    // Main body
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(bw, d.h, bw),
      new THREE.MeshPhongMaterial({ color: d.color, shininess: 40 })
    );
    body.position.y   = d.h / 2;
    body.castShadow   = true;
    body.receiveShadow = true;
    grp.add(body);

    // Type-specific details
    if (type === 'house') {
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(bw * 0.78, 1.1, 4),
        new THREE.MeshPhongMaterial({ color: d.accent })
      );
      roof.position.y   = d.h + 0.55;
      roof.rotation.y   = Math.PI / 4;
      roof.castShadow   = true;
      grp.add(roof);

      // Door
      const door = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.55, 0.05),
        new THREE.MeshPhongMaterial({ color: 0x5D4037 })
      );
      door.position.set(0, 0.27, bw / 2 + 0.03);
      grp.add(door);

    } else if (type === 'park') {
      // Trees on the park tile
      grp.remove(body);
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(bw, 0.2, bw),
        new THREE.MeshPhongMaterial({ color: 0x388E3C })
      );
      base.position.y = 0.1;
      base.receiveShadow = true;
      grp.add(base);
      const positions = [[-0.6,0,.6],[.6,0,.6],[0,0,-.7],[-.5,0,-.2],[.5,0,-.3]];
      positions.forEach(([px,,pz]) => {
        const th = 0.9 + Math.random() * .5;
        const tr = new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,.6,6), new THREE.MeshPhongMaterial({ color:0x5D4037 }));
        tr.position.set(px, .3, pz);
        const lv = new THREE.Mesh(new THREE.ConeGeometry(.45, th, 7), new THREE.MeshPhongMaterial({ color:0x2E7D32 }));
        lv.position.set(px, .6 + th / 2, pz);
        grp.add(tr, lv);
      });

    } else if (type === 'factory') {
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(bw + 0.08, 0.12, bw + 0.08),
        new THREE.MeshPhongMaterial({ color: d.accent })
      );
      roof.position.y = d.h + 0.06;
      grp.add(roof);
      // Chimneys
      for (let i = 0; i < 3; i++) {
        const cx = (i - 1) * 0.7;
        const ch = new THREE.Mesh(
          new THREE.CylinderGeometry(.18, .2, 1.6, 8),
          new THREE.MeshPhongMaterial({ color: 0x795548 })
        );
        ch.position.set(cx, d.h + 0.8, 0);
        ch.castShadow = true;
        grp.add(ch);
        // Smoke ring
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(.25, .06, 6, 12),
          new THREE.MeshBasicMaterial({ color: 0xBBBBBB, transparent: true, opacity: .5 })
        );
        ring.position.set(cx, d.h + 1.7, 0);
        ring.rotation.x = Math.PI / 2;
        grp.add(ring);
      }

    } else if (type === 'tower' || type === 'hotel' || type === 'casino') {
      // Antenna
      const ant = new THREE.Mesh(
        new THREE.CylinderGeometry(.04, .04, 2, 6),
        new THREE.MeshPhongMaterial({ color: 0xCFD8DC })
      );
      ant.position.y = d.h + 1;
      grp.add(ant);
      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(.16, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xFF1744 })
      );
      tip.position.y = d.h + 2.1;
      grp.add(tip);
      // Flat roof
      const rf = new THREE.Mesh(
        new THREE.BoxGeometry(bw + 0.12, 0.14, bw + 0.12),
        new THREE.MeshPhongMaterial({ color: d.accent })
      );
      rf.position.y = d.h + 0.07;
      grp.add(rf);

    } else if (type === 'stadium') {
      // Ring/oval structure
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(bw * 0.58, bw * 0.18, 8, 24),
        new THREE.MeshPhongMaterial({ color: d.accent })
      );
      ring.position.y = d.h + 0.1;
      ring.rotation.x = Math.PI / 2;
      grp.add(ring);
      const rf = new THREE.Mesh(
        new THREE.BoxGeometry(bw + 0.1, 0.12, bw + 0.1),
        new THREE.MeshPhongMaterial({ color: d.accent })
      );
      rf.position.y = d.h + 0.06;
      grp.add(rf);

    } else {
      // Generic flat roof
      const rf = new THREE.Mesh(
        new THREE.BoxGeometry(bw + 0.1, 0.12, bw + 0.1),
        new THREE.MeshPhongMaterial({ color: d.accent })
      );
      rf.position.y = d.h + 0.06;
      grp.add(rf);
    }

    // Windows (glowing panels for tall buildings)
    if (d.h >= 2 && type !== 'park' && type !== 'factory') {
      const winMat = new THREE.MeshBasicMaterial({ color: 0xFFFDE7 });
      const floors = Math.max(1, Math.floor(d.h / 1.1));
      for (let f = 0; f < floors; f++) {
        for (let side = 0; side < 4; side++) {
          const angle = (side * Math.PI) / 2;
          for (let col = -1; col <= 1; col += 2) {
            const win = new THREE.Mesh(new THREE.PlaneGeometry(.24, .28), winMat);
            win.position.set(
              Math.sin(angle) * (bw / 2 + 0.01) + Math.cos(angle) * col * 0.38,
              f * 1.05 + 0.65,
              Math.cos(angle) * (bw / 2 + 0.01) + Math.sin(angle) * col * 0.38
            );
            win.rotation.y = angle;
            grp.add(win);
          }
        }
      }
    }

    // Position on grid
    const { x, z } = cellWorld(gx, gz);
    grp.position.set(x, 0, z);
    grp.userData = { type, gx, gz };
    grp.scale.y  = 0;   // start flat for pop-in
    scene.add(grp);
    popIn(grp);
    return grp;
  }

  function popIn(grp) {
    const t0 = Date.now();
    (function tick() {
      const t = Math.min((Date.now() - t0) / 320, 1);
      grp.scale.y = 1 - Math.pow(1 - t, 3);
      if (t < 1) requestAnimationFrame(tick);
    })();
  }

  function popOut(grp, cb) {
    const t0 = Date.now();
    (function tick() {
      const t = Math.min((Date.now() - t0) / 200, 1);
      grp.scale.y = 1 - t;
      if (t < 1) requestAnimationFrame(tick);
      else cb();
    })();
  }

  // ═══════════════════════════════════════════════
  //  ACTIONS
  // ═══════════════════════════════════════════════
  function placeBuilding(gx, gz) {
    const key = `${gx},${gz}`;
    if (state.grid[key])          { toast('Already occupied!', false); return; }
    const d = DEFS[state.selected];
    if (state.money < d.cost)     { toast('Not enough money!', false); return; }

    state.money     -= d.cost;
    state.income    += d.income;
    state.buildings += 1;
    state.grid[key]  = makeBuilding(state.selected, gx, gz);
    refreshUI();
    toast(`Built ${d.name}! +${fmt(d.income)}/s`, true);
  }

  function demolishAt(gx, gz) {
    const key  = `${gx},${gz}`;
    const grp  = state.grid[key];
    if (!grp) return;
    const d    = DEFS[grp.userData.type];
    const ref  = Math.floor(d.cost * 0.5);
    state.money     += ref;
    state.income    -= d.income;
    state.buildings -= 1;
    delete state.grid[key];
    popOut(grp, () => scene.remove(grp));
    refreshUI();
    toast(`Demolished. Refunded ${fmt(ref)}`, true);
  }

  function clearAll() {
    Object.keys(state.grid).forEach(key => {
      const grp = state.grid[key];
      const d   = DEFS[grp.userData.type];
      state.income    -= d.income;
      state.buildings -= 1;
      popOut(grp, () => scene.remove(grp));
    });
    state.grid = {};
    refreshUI();
    toast('City cleared!', true);
  }

  // ═══════════════════════════════════════════════
  //  RAYCASTING HELPERS
  // ═══════════════════════════════════════════════
  const rc    = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit   = new THREE.Vector3();

  function cellWorld(gx, gz) {
    return {
      x: gx * CELL - HALF + CELL / 2,
      z: gz * CELL - HALF + CELL / 2
    };
  }

  function getCell(e) {
    const r = canvas.getBoundingClientRect();
    mouse.set(
      ((e.clientX - r.left) / r.width)  * 2 - 1,
      -((e.clientY - r.top)  / r.height) * 2 + 1
    );
    rc.setFromCamera(mouse, camera);
    if (!rc.ray.intersectPlane(plane, hit)) return null;
    const gx = Math.floor((hit.x + HALF) / CELL);
    const gz = Math.floor((hit.z + HALF) / CELL);
    if (gx < 0 || gx >= GRID || gz < 0 || gz >= GRID) return null;
    return { gx, gz };
  }

  // ═══════════════════════════════════════════════
  //  MOUSE EVENTS
  // ═══════════════════════════════════════════════
  let hoverCell = null, didDrag = false, downPos = { x:0, y:0 };

  canvas.addEventListener('mousemove', e => {
    if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 4) didDrag = true;
    const cell = getCell(e);
    hoverCell  = cell;
    if (cell) {
      const { x, z } = cellWorld(cell.gx, cell.gz);
      hoverMesh.position.set(x, 0.06, z);
      hoverMesh.visible = true;
      hoverMesh.material.color.setHex(state.bulldoze ? 0xFF5722 : 0xFFD700);
    } else {
      hoverMesh.visible = false;
    }
  });

  canvas.addEventListener('mousedown', e => { downPos = { x:e.clientX, y:e.clientY }; didDrag = false; });
  canvas.addEventListener('mouseup',   () => {
    if (!didDrag && hoverCell) {
      state.bulldoze ? demolishAt(hoverCell.gx, hoverCell.gz)
                     : placeBuilding(hoverCell.gx, hoverCell.gz);
    }
  });
  canvas.addEventListener('mouseleave', () => { hoverMesh.visible = false; hoverCell = null; });

  // ═══════════════════════════════════════════════
  //  TOOLBAR
  // ═══════════════════════════════════════════════
  document.getElementById('btn-bulldoze').addEventListener('click', () => {
    state.bulldoze = !state.bulldoze;
    document.getElementById('btn-bulldoze').classList.toggle('active', state.bulldoze);
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (confirm('Clear all buildings? You\'ll receive 50% refund.')) clearAll();
  });

  // ═══════════════════════════════════════════════
  //  BUILDING BUTTONS
  // ═══════════════════════════════════════════════
  const panel = document.getElementById('building-panel');
  Object.entries(DEFS).forEach(([key, d]) => {
    const btn = document.createElement('div');
    btn.className = 'bld-btn' + (key === state.selected ? ' selected' : '');
    btn.id        = `b-${key}`;
    btn.innerHTML = `
      <div class="bld-icon">${d.icon}</div>
      <div class="bld-name">${d.name}</div>
      <div class="bld-cost">${fmt(d.cost)}</div>
      <div class="bld-inc">+${fmt(d.income)}/s</div>
    `;
    btn.addEventListener('click', () => {
      state.selected  = key;
      state.bulldoze  = false;
      document.getElementById('btn-bulldoze').classList.remove('active');
      document.querySelectorAll('.bld-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      // Update info card
      const ic = document.getElementById('info-card');
      ic.style.display = 'block';
      document.getElementById('ic-name').textContent   = `${d.icon} ${d.name}`;
      document.getElementById('ic-desc').textContent   = d.desc;
      document.getElementById('ic-cost').textContent   = fmt(d.cost);
      document.getElementById('ic-income').textContent = `+${fmt(d.income)}/s`;
      const roi = Math.ceil(d.cost / d.income);
      document.getElementById('ic-roi').textContent    = `${roi}s payback`;
    });
    panel.appendChild(btn);
  });

  // ═══════════════════════════════════════════════
  //  ECONOMY TICK
  // ═══════════════════════════════════════════════
  setInterval(() => {
    state.seconds++;
    if (state.income > 0) {
      state.money  += state.income;
      state.earned += state.income;
    }
    refreshUI();
  }, 1000);

  // ═══════════════════════════════════════════════
  //  UI HELPERS
  // ═══════════════════════════════════════════════
  function fmt(n) {
    if (n >= 1e9)  return `$${(n/1e9).toFixed(2)}B`;
    if (n >= 1e6)  return `$${(n/1e6).toFixed(1)}M`;
    if (n >= 1000) return `$${(n/1000).toFixed(1)}K`;
    return `$${Math.floor(n)}`;
  }

  function refreshUI() {
    document.getElementById('money').textContent    = fmt(state.money);
    document.getElementById('income').textContent   = `${fmt(state.income)}/s`;
    document.getElementById('s-buildings').textContent = state.buildings;
    document.getElementById('s-earned').textContent    = fmt(state.earned);
    const m = Math.floor(state.seconds / 60), s = state.seconds % 60;
    document.getElementById('s-time').textContent =
      m > 0 ? `${m}m ${s}s` : `${s}s`;
    // Grey out unaffordable buttons
    Object.keys(DEFS).forEach(key => {
      const btn = document.getElementById(`b-${key}`);
      if (btn) btn.classList.toggle('cant-afford', state.money < DEFS[key].cost);
    });
  }

  let toastTimer;
  function toast(msg, ok) {
    clearTimeout(toastTimer);
    const el = document.getElementById('toast');
    el.textContent   = msg;
    el.style.background = ok ? 'rgba(46,125,50,.92)' : 'rgba(198,40,40,.92)';
    el.style.opacity = '1';
    toastTimer = setTimeout(() => el.style.opacity = '0', 2200);
  }

  // ═══════════════════════════════════════════════
  //  RESIZE
  // ═══════════════════════════════════════════════
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ═══════════════════════════════════════════════
  //  RENDER LOOP
  // ═══════════════════════════════════════════════
  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    clouds.forEach(c => {
      c.mesh.position.x += c.speed;
      if (c.mesh.position.x >  80) c.mesh.position.x = -80;
      if (c.mesh.position.x < -80) c.mesh.position.x =  80;
    });
    renderer.render(scene, camera);
  })();

  refreshUI();
  </script>
</body>
</html>
