<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Tycoon</title>
<style>
:root{
  --bg:#11171f; --panel:#1a2331; --panel2:#243140; --panel3:#2d3d50; --line:rgba(255,255,255,.08);
  --text:#e9eff6; --muted:#8ea1b6; --accent:#ffb347; --good:#5ad17a; --bad:#ff6b6b; --blue:#5aa9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover{background:var(--panel3)}
button.active{border-color:var(--accent);background:rgba(255,179,71,.16);color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.danger{border-color:rgba(255,107,107,.4);color:var(--bad)}
button.danger:hover{background:rgba(255,107,107,.15)}
button.primary{border-color:rgba(90,169,255,.5);color:var(--blue)}
h1{font-size:17px;letter-spacing:.3px;white-space:nowrap}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 8px}
h2:first-child{margin-top:0}
small,.muted{color:var(--muted)}
#app{display:grid;grid-template-rows:58px 1fr;height:100%}
#hud{display:flex;align-items:center;gap:20px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#hud .stats{display:flex;gap:22px;flex:1;justify-content:center}
.stat{display:flex;align-items:center;gap:8px}
.stat .ico{font-size:20px}
.stat .val{font-size:18px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.val.neg{color:var(--bad)}
#speed{display:flex;gap:4px}
#speed button{padding:5px 9px;min-width:36px}
#main{display:grid;grid-template-columns:262px 1fr 272px;min-height:0}
aside{background:var(--panel);overflow-y:auto;padding:12px;border-right:1px solid var(--line)}
#info{border-right:none;border-left:1px solid var(--line)}
#tools{display:flex;gap:6px;margin-bottom:10px}
#tools button{flex:1;padding:7px 4px;font-size:13px}
#tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
#tabs button{flex:1;padding:6px 4px;font-size:12px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 9px;margin-bottom:6px;border-radius:10px}
.item .ico{font-size:22px;width:30px;text-align:center}
.item .nm{font-weight:600;font-size:13px}
.item .cs{font-size:11px;color:var(--muted)}
.item .cost{margin-left:auto;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.row b{font-variant-numeric:tabular-nums}
.pm{display:flex;align-items:center;gap:6px}
.pm button{padding:3px 9px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.desc{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 0 10px}
.tip{font-size:12px;background:rgba(255,179,71,.09);border-left:3px solid var(--accent);padding:6px 8px;border-radius:0 8px 8px 0;margin-bottom:6px;line-height:1.4}
.ms{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.ms .chk{width:18px;text-align:center}
.ms.done{color:var(--good)}
.ms.done .d{color:var(--muted)}
.ms .d{color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{flex:1}
#wrap{position:relative;display:flex;align-items:center;justify-content:center;background:#0d1219;overflow:hidden}
canvas{display:block;image-rendering:auto;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 20px 60px rgba(0,0,0,.5)}
#toasts{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5;width:min(520px,90%)}
.toast{background:rgba(20,28,40,.92);border:1px solid var(--line);border-left:3px solid var(--blue);padding:8px 12px;border-radius:8px;font-size:13px;animation:tin .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.bad{border-left-color:var(--bad)}
.toast.good{border-left-color:var(--good)}
.toast.fade{opacity:0;transition:opacity .5s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#overlay{position:absolute;inset:0;background:rgba(8,12,18,.78);display:flex;align-items:center;justify-content:center;z-index:10}
#overlay.hidden{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 30px;max-width:560px;width:92%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card h1{font-size:24px;margin-bottom:6px}
.card p{color:var(--muted);line-height:1.55;margin:8px 0}
.card ul{margin:10px 0 14px 18px;color:var(--text);line-height:1.6;font-size:13px}
.card .btns button{padding:10px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;font-family:inherit}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(20,28,40,.8);padding:5px 12px;border-radius:20px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <h1>🎡 Park Tycoon</h1>
    <div class="stats">
      <div class="stat"><span class="ico">💰</span><div><div class="val" id="h-cash">$0</div><div class="lbl">Cash</div></div></div>
      <div class="stat"><span class="ico">🧍</span><div><div class="val" id="h-guests">0</div><div class="lbl">Guests</div></div></div>
      <div class="stat"><span class="ico">⭐</span><div><div class="val" id="h-rating">0</div><div class="lbl" id="h-rating-lbl">Rating</div></div></div>
      <div class="stat"><span class="ico">📅</span><div><div class="val" id="h-day">Day 1</div><div class="lbl" id="h-clock">09:00</div></div></div>
    </div>
    <div id="speed">
      <button data-speed="0" title="Pause (Space)">⏸</button>
      <button data-speed="1" title="Normal speed (1)">▶</button>
      <button data-speed="2" title="Fast (2)">▶▶</button>
      <button data-speed="4" title="Fastest (3)">▶▶▶</button>
    </div>
    <button id="help-btn" title="How to play">?</button>
  </header>
  <div id="main">
    <aside id="build">
      <div id="tools">
        <button id="t-select" title="Select / inspect (Esc)">🖱️ Select</button>
        <button id="t-path" title="Footpath (P)">🟫 Path</button>
        <button id="t-bull" title="Bulldoze (B)">🚜 Remove</button>
      </div>
      <div id="tabs">
        <button data-tab="ride">🎢 Rides</button>
        <button data-tab="shop">🍔 Shops</button>
        <button data-tab="scenery">🌳 Scenery</button>
        <button data-tab="staff">👷 Staff</button>
        <button data-tab="park">📊 Park</button>
      </div>
      <div id="tab-body"></div>
    </aside>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="toasts"></div>
      <div id="hint"></div>
      <div id="overlay"></div>
    </div>
    <aside id="info"></aside>
  </div>
</div>

<script>
'use strict';
// ───────────────────────── constants ─────────────────────────
const W = 26, H = 16, T = 40, DAY_LEN = 90, MAX_GUESTS = 320;
const GRASS = 0, PATH = 1, BUILD = 2;
const ENTRANCE = { x: Math.floor(W / 2), y: H - 1 };
const SAVE_KEY = 'parkTycoonSave_v1';
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const GUEST_SPEED = 1.7, STAFF_SPEED = 2.2;

const DEFS = {
  path:     { cat: 'path', name: 'Footpath', icon: '▦', w: 1, h: 1, cost: 20, desc: 'Guests only walk on paths. Click and drag to draw.' },
  // rides
  carousel: { cat: 'ride', name: 'Carousel', icon: '🎠', w: 2, h: 2, cost: 1500, upkeep: 12, price: 3, cap: 10, dur: 8, exc: 3, inten: 1, naus: 0, rel: 0.985, color: '#f4a7c7' },
  teacups:  { cat: 'ride', name: 'Spinning Teacups', icon: '☕', w: 2, h: 2, cost: 2200, upkeep: 15, price: 4, cap: 12, dur: 10, exc: 4, inten: 2, naus: 3, rel: 0.98, color: '#9bd7f0' },
  bumper:   { cat: 'ride', name: 'Bumper Cars', icon: '🚗', w: 3, h: 2, cost: 3000, upkeep: 20, price: 4, cap: 12, dur: 12, exc: 5, inten: 2, naus: 1, rel: 0.975, color: '#f7c56a' },
  ferris:   { cat: 'ride', name: 'Ferris Wheel', icon: '🎡', w: 2, h: 2, cost: 4500, upkeep: 25, price: 5, cap: 16, dur: 16, exc: 6, inten: 2, naus: 0, rel: 0.985, color: '#b8a1f2' },
  haunted:  { cat: 'ride', name: 'Haunted House', icon: '👻', w: 2, h: 2, cost: 3800, upkeep: 22, price: 5, cap: 12, dur: 14, exc: 6, inten: 3, naus: 1, rel: 0.98, color: '#8e94a8' },
  flume:    { cat: 'ride', name: 'Log Flume', icon: '🛶', w: 3, h: 3, cost: 7000, upkeep: 35, price: 6, cap: 16, dur: 20, exc: 7, inten: 3, naus: 2, rel: 0.97, color: '#6fc3e8' },
  drop:     { cat: 'ride', name: 'Drop Tower', icon: '🗼', w: 2, h: 2, cost: 9000, upkeep: 40, price: 7, cap: 12, dur: 10, exc: 8, inten: 5, naus: 4, rel: 0.96, color: '#ff8a65' },
  coaster:  { cat: 'ride', name: 'Roller Coaster', icon: '🎢', w: 4, h: 3, cost: 16000, upkeep: 60, price: 9, cap: 24, dur: 22, exc: 10, inten: 5, naus: 3, rel: 0.95, color: '#ff6b6b' },
  // shops
  burger:   { cat: 'shop', name: 'Burger Stand', icon: '🍔', w: 1, h: 1, cost: 800, upkeep: 8, price: 5, need: 'hunger', color: '#f2b56b' },
  icecream: { cat: 'shop', name: 'Ice Cream', icon: '🍦', w: 1, h: 1, cost: 700, upkeep: 7, price: 3, need: 'hunger', color: '#fbe1ee' },
  drink:    { cat: 'shop', name: 'Drink Stand', icon: '🥤', w: 1, h: 1, cost: 600, upkeep: 6, price: 2.5, need: 'thirst', color: '#7fd1f5' },
  restroom: { cat: 'shop', name: 'Restroom', icon: '🚻', w: 1, h: 1, cost: 900, upkeep: 10, price: 0.5, need: 'bladder', color: '#a5c8e8' },
  souvenir: { cat: 'shop', name: 'Souvenir Shop', icon: '🎁', w: 2, h: 1, cost: 1400, upkeep: 10, price: 8, need: 'souvenir', color: '#c8a2f2' },
  // scenery
  tree:     { cat: 'scenery', name: 'Tree', icon: '🌳', w: 1, h: 1, cost: 60, beauty: 3, color: '#4e9a4a' },
  flower:   { cat: 'scenery', name: 'Flower Bed', icon: '🌷', w: 1, h: 1, cost: 40, beauty: 2, color: '#7fbf6a' },
  bench:    { cat: 'scenery', name: 'Bench', icon: '🪑', w: 1, h: 1, cost: 80, beauty: 1, rest: true, color: '#c9a26b' },
  bin:      { cat: 'scenery', name: 'Trash Bin', icon: '🗑️', w: 1, h: 1, cost: 50, beauty: 0, bin: true, color: '#8c9aa8' },
  lamp:     { cat: 'scenery', name: 'Lamp Post', icon: '💡', w: 1, h: 1, cost: 70, beauty: 1, color: '#d9d3b8' },
  fountain: { cat: 'scenery', name: 'Fountain', icon: '⛲', w: 2, h: 2, cost: 900, beauty: 8, color: '#86c9e6' },
  statue:   { cat: 'scenery', name: 'Statue', icon: '🗿', w: 1, h: 1, cost: 1200, beauty: 6, color: '#b9b9b9' },
};
const STAFF = {
  janitor:     { name: 'Janitor', icon: '🧹', hire: 300, wage: 20, color: '#ff9f43', desc: 'Sweeps litter off paths.' },
  mechanic:    { name: 'Mechanic', icon: '🔧', hire: 500, wage: 35, color: '#4aa3ff', desc: 'Repairs broken rides.' },
  entertainer: { name: 'Entertainer', icon: '🤹', hire: 400, wage: 25, color: '#c56cf0', desc: 'Cheers up nearby guests.' },
};
const MILESTONES = [
  { id: 'g10', name: 'Grand Opening', desc: 'Welcome 10 guests', cond: s => s.totalGuests >= 10, bonus: 500 },
  { id: 'r3', name: 'Thrill Seeker', desc: 'Build 3 rides', cond: () => countCat('ride') >= 3, bonus: 1000 },
  { id: 'rt500', name: 'Rising Star', desc: 'Reach a park rating of 500', cond: s => s.rating >= 500, bonus: 2000 },
  { id: 'g100', name: 'Crowd Pleaser', desc: 'Have 100 guests in the park at once', cond: s => s.guests.length >= 100, bonus: 3000 },
  { id: 'coaster', name: 'Coaster King', desc: 'Build a Roller Coaster', cond: () => hasKey('coaster'), bonus: 4000 },
  { id: 'rt750', name: 'Destination Park', desc: 'Reach a park rating of 750', cond: s => s.rating >= 750, bonus: 5000 },
  { id: 'e50k', name: 'Tycoon', desc: 'Earn $50,000 in total income', cond: s => s.totalEarned >= 50000, bonus: 5000 },
  { id: 'g200', name: 'Packed House', desc: 'Have 200 guests in the park at once', cond: s => s.guests.length >= 200, bonus: 8000 },
  { id: 'rt900', name: 'World Class', desc: 'Reach a park rating of 900', cond: s => s.rating >= 900, bonus: 10000 },
];

// ───────────────────────── helpers ─────────────────────────
const $ = s => document.querySelector(s);
const fmt = n => Math.round(Math.abs(n)).toLocaleString();
const money = n => (n < 0 ? '-$' : '$') + fmt(n);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const K = (x, y) => y * W + x;
const KX = k => k % W, KY = k => Math.floor(k / W);
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

function blankLedger() { return { tickets: 0, rides: 0, shops: 0, upkeep: 0, wages: 0, marketing: 0, build: 0, interest: 0, guestsIn: 0 }; }
function countCat(cat) { let n = 0; for (const b of Object.values(S.buildings)) if (DEFS[b.key].cat === cat) n++; return n; }
function hasKey(key) { return Object.values(S.buildings).some(b => b.key === key); }
function ratingLabel(r) { return r < 200 ? 'Awful' : r < 350 ? 'Poor' : r < 500 ? 'Okay' : r < 650 ? 'Good' : r < 800 ? 'Great' : r < 900 ? 'Excellent' : 'Legendary'; }

// ───────────────────────── state ─────────────────────────
let S = null;
let reach = new Set(), beauty = null, binMap = null;
let tool = { kind: 'select', key: null }, hover = null, selected = null, dragging = false, lastDragKey = -1;
let curTab = 'ride', spawnAcc = 0, secAcc = 0, gameOver = false, lastToastKey = {};

function newState() {
  const grid = [];
  for (let y = 0; y < H; y++) { const row = []; for (let x = 0; x < W; x++) row.push({ t: GRASS, b: 0 }); grid.push(row); }
  S = {
    grid, buildings: {}, nextId: 1, guests: [], staff: [], litter: {},
    cash: 25000, ticket: 10, time: 0, day: 1, speed: 1, paused: false, rating: 0, marketing: 0, loan: 0,
    today: blankLedger(), yesterday: null, totalEarned: 0, totalGuests: 0, milestones: {}, peakGuests: 0,
  };
  for (let i = 0; i < 4; i++) S.grid[H - 1 - i][ENTRANCE.x].t = PATH;
  spawnAcc = 0; secAcc = 0; gameOver = false; selected = null;
  recomputeStatic();
  computeRating();
}

function recomputeStatic() {
  reach = new Set();
  const q = [K(ENTRANCE.x, ENTRANCE.y)]; reach.add(q[0]); let qi = 0;
  while (qi < q.length) {
    const k = q[qi++], x = KX(k), y = KY(k);
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny) || S.grid[ny][nx].t !== PATH) continue;
      const nk = K(nx, ny); if (reach.has(nk)) continue; reach.add(nk); q.push(nk);
    }
  }
  beauty = new Float32Array(W * H); binMap = new Uint8Array(W * H);
  for (const b of Object.values(S.buildings)) {
    const d = DEFS[b.key]; if (d.cat !== 'scenery') continue;
    const cx = b.x + d.w / 2 - .5, cy = b.y + d.h / 2 - .5;
    for (let y = Math.max(0, b.y - 4); y < Math.min(H, b.y + d.h + 4); y++)
      for (let x = Math.max(0, b.x - 4); x < Math.min(W, b.x + d.w + 4); x++) {
        const dist = Math.hypot(x - cx, y - cy);
        if (d.beauty && dist <= 3.5) beauty[K(x, y)] += d.beauty * (1 - dist / 4);
        if (d.bin && dist <= 2.5) binMap[K(x, y)] = 1;
      }
  }
}

// ───────────────────────── building ─────────────────────────
function canPlace(key, x, y) {
  const d = DEFS[key];
  for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) {
    const tx = x + i, ty = y + j;
    if (!inb(tx, ty) || S.grid[ty][tx].t !== GRASS) return false;
  }
  return true;
}
function place(key, x, y) {
  const d = DEFS[key];
  if (!canPlace(key, x, y)) {
    if (!(key === 'path' && inb(x, y) && S.grid[y][x].t === PATH)) toastOnce('place', "Can't build there", 'bad');
    return false;
  }
  if (S.cash < d.cost) { toastOnce('cash', 'Not enough cash', 'bad'); return false; }
  S.cash -= d.cost; S.today.build += d.cost;
  if (key === 'path') { S.grid[y][x].t = PATH; recomputeStatic(); return true; }
  const id = S.nextId++;
  const b = { id, key, x, y };
  if (d.cat === 'ride') Object.assign(b, { price: d.price, open: true, broken: false, queue: [], riders: [], state: 'idle', timer: 0, wait: 0, ridesGiven: 0, income: 0, breakdowns: 0, fixing: 0, age: 0 });
  if (d.cat === 'shop') Object.assign(b, { price: d.price, sold: 0, income: 0 });
  S.buildings[id] = b;
  for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) { const c = S.grid[y + j][x + i]; c.t = BUILD; c.b = id; }
  recomputeStatic();
  if ((d.cat === 'ride' || d.cat === 'shop') && adjTiles(b).length === 0) toast(`${d.name} built, but guests can't reach it yet. Connect it with a path.`, 'bad');
  return true;
}
function bulldoze(x, y) {
  if (!inb(x, y)) return;
  const c = S.grid[y][x];
  if (c.t === PATH) {
    if (x === ENTRANCE.x && y === ENTRANCE.y) { toastOnce('ent', "You can't remove the park entrance", 'bad'); return; }
    c.t = GRASS; S.cash += 10; delete S.litter[K(x, y)]; recomputeStatic();
  } else if (c.t === BUILD) removeBuilding(c.b);
}
function removeBuilding(id) {
  const b = S.buildings[id]; if (!b) return;
  const d = DEFS[b.key];
  if (d.cat === 'ride') for (const g of [...b.queue, ...b.riders]) releaseGuest(g, b, -5);
  for (let j = 0; j < d.h; j++) for (let i = 0; i < d.w; i++) { const c = S.grid[b.y + j][b.x + i]; c.t = GRASS; c.b = 0; }
  delete S.buildings[id];
  const refund = Math.round(d.cost * 0.5); S.cash += refund;
  recomputeStatic();
  if (selected === id) selected = null;
  toast(`${d.name} demolished (refund ${money(refund)})`);
}
function adjTiles(b) {
  const d = DEFS[b.key], out = [];
  for (let i = 0; i < d.w; i++) { out.push({ x: b.x + i, y: b.y - 1 }, { x: b.x + i, y: b.y + d.h }); }
  for (let j = 0; j < d.h; j++) { out.push({ x: b.x - 1, y: b.y + j }, { x: b.x + d.w, y: b.y + j }); }
  return out.filter(p => inb(p.x, p.y) && S.grid[p.y][p.x].t === PATH && reach.has(K(p.x, p.y)));
}

// ───────────────────────── pathfinding ─────────────────────────
function bfs(sx, sy, goals) {
  const gk = new Set(goals.map(p => K(p.x, p.y)));
  const sk = K(sx, sy);
  if (gk.has(sk)) return [];
  if (S.grid[sy][sx].t !== PATH) return null;
  const prev = new Map([[sk, -1]]); const q = [sk]; let qi = 0;
  while (qi < q.length) {
    const k = q[qi++], x = KX(k), y = KY(k);
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny) || S.grid[ny][nx].t !== PATH) continue;
      const nk = K(nx, ny); if (prev.has(nk)) continue;
      prev.set(nk, k);
      if (gk.has(nk)) {
        const path = []; let c = nk;
        while (c !== sk) { path.push({ x: KX(c), y: KY(c) }); c = prev.get(c); }
        return path.reverse();
      }
      q.push(nk);
    }
  }
  return null;
}
function floodPick(sx, sy, maxDepth) {
  if (S.grid[sy][sx].t !== PATH) return null;
  const sk = K(sx, sy); const prev = new Map([[sk, -1]]); const depth = new Map([[sk, 0]]);
  const q = [sk]; let qi = 0; const cands = [];
  while (qi < q.length) {

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function emoji(txt, x, y, size) { ctx.font = `${size}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y + size * 0.06); }
function hash(k) { let h = (k * 2654435761) >>> 0; h ^= h >>> 13; h = (h * 1274126177) >>> 0; return (h >>> 0) / 4294967296; }

function render() {
  const g = S.grid;
  // grass
  ctx.fillStyle = '#5fae4a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,.045)';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if ((x + y) & 1) ctx.fillRect(x * T, y * T, T, T);
  // paths
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (g[y][x].t !== PATH) continue;
    ctx.fillStyle = reach.has(K(x, y)) ? '#d9cba4' : '#c4b799';
    ctx.fillRect(x * T, y * T, T, T);
    ctx.strokeStyle = 'rgba(90,70,40,.18)'; ctx.lineWidth = 1;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (inb(nx, ny) && g[ny][nx].t === PATH) continue;
      ctx.beginPath();
      if (dx === 1) { ctx.moveTo((x + 1) * T - .5, y * T); ctx.lineTo((x + 1) * T - .5, (y + 1) * T); }
      if (dx === -1) { ctx.moveTo(x * T + .5, y * T); ctx.lineTo(x * T + .5, (y + 1) * T); }
      if (dy === 1) { ctx.moveTo(x * T, (y + 1) * T - .5); ctx.lineTo((x + 1) * T, (y + 1) * T - .5); }
      if (dy === -1) { ctx.moveTo(x * T, y * T + .5); ctx.lineTo((x + 1) * T, y * T + .5); }
      ctx.stroke();
    }
  }
  // litter
  for (const [ks, n] of Object.entries(S.litter)) {
    const k = +ks, x = KX(k), y = KY(k);
    for (let i = 0; i < Math.min(n, 5); i++) {
      const px = x * T + 6 + hash(k * 7 + i) * (T - 12), py = y * T + 6 + hash(k * 13 + i + 99) * (T - 12);
      ctx.fillStyle = i % 2 ? '#8b5a2b' : '#c94f4f'; ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // entrance
  ctx.fillStyle = 'rgba(200,60,60,.35)'; ctx.fillRect(ENTRANCE.x * T, ENTRANCE.y * T, T, T);
  emoji('🎪', (ENTRANCE.x + .5) * T, (ENTRANCE.y + .45) * T, 26);
  // buildings
  for (const b of Object.values(S.buildings)) {
    const d = DEFS[b.key], px = b.x * T, py = b.y * T, pw = d.w * T, ph = d.h * T;
    if (d.cat === 'scenery') {
      if (d.w > 1 || d.h > 1) { ctx.fillStyle = d.color; rr(px + 3, py + 3, pw - 6, ph - 6, 10); ctx.fill(); }
      emoji(d.icon, px + pw / 2, py + ph / 2, Math.min(pw, ph) * 0.7);
      continue;
    }
    ctx.fillStyle = d.color; rr(px + 2, py + 2, pw - 4, ph - 4, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 2; ctx.stroke();
    if (d.cat === 'ride' && b.state === 'running') {
      ctx.save(); ctx.translate(px + pw / 2, py + ph / 2); ctx.rotate(S.time * 2.2);
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.setLineDash([8, 7]); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, Math.min(pw, ph) * 0.42, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    emoji(d.icon, px + pw / 2, py + ph / 2 - (d.cat === 'ride' ? 4 : 0), Math.min(pw, ph) * (d.cat === 'ride' ? 0.5 : 0.62));
    if (d.cat === 'ride') {
      if (b.broken) { ctx.fillStyle = 'rgba(180,30,30,.45)'; rr(px + 2, py + 2, pw - 4, ph - 4, 9); ctx.fill(); emoji('⚠️', px + pw / 2, py + ph / 2, Math.min(pw, ph) * 0.45); }
      else if (!b.open) { ctx.fillStyle = 'rgba(40,40,50,.55)'; rr(px + 2, py + 2, pw - 4, ph - 4, 9); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CLOSED', px + pw / 2, py + ph / 2); }
      const inside = b.queue.length + b.riders.length;
      if (inside > 0 && !b.broken) {
        ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(px + pw - 34, py + ph - 18, 30, 14, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👥' + inside, px + pw - 19, py + ph - 11);
      }
    }
    if ((d.cat === 'ride' || d.cat === 'shop') && !adjTiles(b).length) {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(px + 4, py + 4, 22, 16, 6); ctx.fill(); emoji('🚧', px + 15, py + 12, 12);
    }
    if (selected === b.id) { ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3; rr(px + 1, py + 1, pw - 2, ph - 2, 10); ctx.stroke(); }
  }
  // guests
  ctx.lineWidth = 1.2;
  for (const gu of S.guests) {
    if (gu.state === 'queued' || gu.state === 'riding') continue;
    const x = gu.x + gu.ox, y = gu.y + gu.oy;
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x, y + 5, 5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsl(${gu.hue},62%,52%)`; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
    ctx.fillStyle = '#f5d6b8'; ctx.beginPath(); ctx.arc(x, y - 5.5, 3.2, 0, Math.PI * 2); ctx.fill();
    const ic = gu.nausea > 70 ? '🤢' : gu.happy < 18 ? '😠' : gu.bladder > 85 ? '🚻' : gu.hunger > 82 ? '🍔' : gu.thirst > 82 ? '🥤' : gu.energy < 15 ? '😴' : gu.happy > 97 ? '😄' : null;
    if (ic) emoji(ic, x, y - 15, 11);
  }
  // staff
  for (const s of S.staff) {
    const d = STAFF[s.type];
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(s.x, s.y + 7, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = d.color; rr(s.x - 8, s.y - 8, 16, 16, 5); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    emoji(d.icon, s.x, s.y, 11);
    if (s.state === 'working') { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(['·', '··', '···'][Math.floor(S.time * 3) % 3], s.x, s.y - 14); }
  }
  // day/night tint
  const tod = (S.time % DAY_LEN) / DAY_LEN;
  const dusk = tod > 0.72 ? (tod - 0.72) / 0.28 : 0;
  if (dusk > 0) { ctx.fillStyle = `rgba(25,30,80,${dusk * 0.38})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  // ghost
  if (hover && !gameOver) {
    if (tool.kind === 'build') {
      const d = DEFS[tool.key], ok = canPlace(tool.key, hover.x, hover.y) && S.cash >= d.cost;
      ctx.fillStyle = ok ? 'rgba(90,209,122,.45)' : 'rgba(255,90,90,.45)';
      ctx.fillRect(hover.x * T, hover.y * T, d.w * T, d.h * T);
      ctx.strokeStyle = ok ? '#5ad17a' : '#ff6b6b'; ctx.lineWidth = 2; ctx.strokeRect(hover.x * T + 1, hover.y * T + 1, d.w * T - 2, d.h * T - 2);
      if (tool.key !== 'path') { ctx.globalAlpha = .8; emoji(d.icon, (hover.x + d.w / 2) * T, (hover.y + d.h / 2) * T, Math.min(d.w, d.h) * T * 0.55); ctx.globalAlpha = 1; }
    } else if (tool.kind === 'bulldoze') {
      ctx.fillStyle = 'rgba(255,80,80,.35)'; ctx.fillRect(hover.x * T, hover.y * T, T, T);
      ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2; ctx.strokeRect(hover.x * T + 1, hover.y * T + 1, T - 2, T - 2);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.strokeRect(hover.x * T + 1, hover.y * T + 1, T - 2, T - 2);
    }
  }
  if (S.paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⏸ PAUSED', canvas.width / 2, canvas.height / 2);
    ctx.font = '14px system-ui'; ctx.fillText('press Space to resume', canvas.width / 2, canvas.height / 2 + 30);
  }
}

    const shops = Object.values(S.buildings).filter(b => DEFS[b.key].cat === 'shop');
    html += `<h2>Park overview</h2>
      <div class="row"><span>Rating</span><b>${S.rating} <small>· ${ratingLabel(S.rating)}</small></b></div>
      <div class="row"><span>Guests in park</span><b>${gs.length} <small>· peak ${S.peakGuests}</small></b></div>
      <div class="row"><span>Total visitors</span><b>${fmt(S.totalGuests)}</b></div>
      <div class="row"><span>Rides · shops · staff</span><b>${rides.length} · ${shops.length} · ${S.staff.length}</b></div>
      <div class="row"><span>Litter on paths</span><b style="color:${litterN > 8 ? 'var(--bad)' : 'inherit'}">${litterN}</b></div>
      <h2>Guest mood</h2>${gs.length ? needBar('Happiness', avg('happy')) + needBar('Hunger', avg('hunger'), true) + needBar('Thirst', avg('thirst'), true) + needBar('Restroom need', avg('bladder'), true) + needBar('Energy', avg('energy')) : '<div class="desc">No guests yet. Build a ride and connect it to the entrance with a path.</div>'}`;
    const tips = [];
    if (!rides.length) tips.push('Build your first ride from the Rides tab and connect it to the entrance path.');
    if (unreachable) tips.push(`${unreachable} ride${unreachable > 1 ? 's are' : ' is'} not connected to a path.`);
    if (broken) tips.push(`${broken} ride${broken > 1 ? 's are' : ' is'} broken.` + (S.staff.some(s => s.type === 'mechanic') ? '' : ' Hire a mechanic.'));
    if (gs.length >= 5) {
      if (pct(g => g.hunger > 65) > 30) tips.push('Many guests are hungry. Build food stalls.');
      if (pct(g => g.thirst > 65) > 30) tips.push('Guests are thirsty. Add drink stands.');
      if (pct(g => g.bladder > 70) > 25) tips.push('Guests need restrooms.');
      if (pct(g => g.energy < 30) > 25) tips.push('Guests are tired. Place benches along paths.');
      if (pct(g => g.nausea > 60) > 20) tips.push('Guests feel sick after intense rides. Mix in gentle rides and benches.');
    }
    if (litterN > 8) tips.push('Litter is piling up. Hire a janitor or add trash bins near food stalls.');
    if (S.rating < 400 && countCat('scenery') < 5 && rides.length) tips.push('Scenery like trees and fountains lifts guest happiness and park rating.');
    if (S.cash < 0) tips.push('Cash is negative. Raise prices, close unprofitable rides, or take a loan.');
    if (tips.length) { html += '<h2>Advisor</h2>'; for (const t of tips) html += `<div class="tip">${t}</div>`; }
    html += `<h2>Guest preferences</h2><div class="desc">Guests have an intensity preference from 1 to 5 and will skip rides that are too wild for them. Offer a mix, keep them fed, and keep paths clean.</div>`;
  }
  box.innerHTML = html;
  if (b) {
    box.querySelectorAll('[data-price]').forEach(bt => bt.onclick = () => { b.price = clamp(Math.round((b.price + (+bt.dataset.price)) * 2) / 2, 0, 50); renderInfo(); });
    const tg = $('#b-toggle'); if (tg) tg.onclick = () => { b.open = !b.open; if (!b.open) { for (const g of [...b.queue, ...b.riders]) releaseGuest(g, b, -4); b.queue = []; b.riders = []; b.state = 'idle'; } renderInfo(); };
    const dm = $('#b-demo'); if (dm) dm.onclick = () => { removeBuilding(b.id); renderInfo(); };
    const cl = $('#b-close'); if (cl) cl.onclick = () => { selected = null; renderInfo(); };
  }
}
function showOverlay(html) { const o = $('#overlay'); o.innerHTML = `<div class="card">${html}</div>`; o.classList.remove('hidden'); }
function hideOverlay() { $('#overlay').classList.add('hidden'); }
function showHelp(firstTime) {
  showOverlay(`<h1>🎡 Park Tycoon</h1><p>Build and run your own theme park. Lay paths, build rides and shops, hire staff, and keep guests happy to grow your rating and your fortune.</p>
    <ul><li><b>Paths</b> connect everything. Guests only walk on paths, starting from the entrance 🎪 at the bottom.</li>
    <li><b>Rides</b> earn ticket money and boost your rating. They break down over time, so hire a <b>mechanic</b>.</li>
    <li><b>Shops</b> feed guests and stop them leaving hungry. Food creates litter, so add bins and a <b>janitor</b>.</li>
    <li><b>Scenery</b> makes guests happier. <b>Benches</b> let tired guests rest.</li>
    <li>Set your <b>admission price</b> and run ad campaigns from the Park tab. Upkeep and wages are charged each night.</li>
    <li>Keys: <kbd>Space</kbd> pause · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> speed · <kbd>P</kbd> path · <kbd>B</kbd> bulldoze · <kbd>Esc</kbd> select · right-click cancels a tool.</li></ul>
    <div class="btns"><button id="ov-ok" class="primary">${firstTime ? 'Open the park!' : 'Back to the park'}</button></div>`);
  $('#ov-ok').onclick = () => { hideOverlay(); if (firstTime) { S.paused = false; } };
}

// ───────────────────────── input ─────────────────────────
function tileFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H);
  return inb(x, y) ? { x, y } : null;
}
function applyTool(t) {
  if (!t || gameOver) return;
  if (tool.kind === 'build') {
    if (place(tool.key, t.x, t.y)) { if (DEFS[tool.key].cat !== 'path' && DEFS[tool.key].cat !== 'scenery' && DEFS[tool.key].cost > 500) { /* keep tool for repeat placement */ } }
  } else if (tool.kind === 'bulldoze') bulldoze(t.x, t.y);
}
canvas.addEventListener('mousemove', e => {
  hover = tileFromEvent(e);
  if (dragging && hover && (tool.kind === 'bulldoze' || (tool.kind === 'build' && tool.key === 'path'))) {
    const k = K(hover.x, hover.y); if (k !== lastDragKey) { lastDragKey = k; applyTool(hover); }
  }
});
canvas.addEventListener('mouseleave', () => { hover = null; dragging = false; });
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const t = tileFromEvent(e); if (!t) return;
  if (tool.kind === 'select') {
    const c = S.grid[t.y][t.x];
    selected = c.t === BUILD ? c.b : null; renderInfo(); return;
  }
  dragging = true; lastDragKey = K(t.x, t.y); applyTool(t);
});
window.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); if (tool.kind !== 'select') setTool('select'); else if (selected) { selected = null; renderInfo(); } });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; }
  else if (e.key === '1') { S.speed = 1; S.paused = false; } else if (e.key === '2') { S.speed = 2; S.paused = false; } else if (e.key === '3') { S.speed = 4; S.paused = false; }
  else if (e.key === 'Escape') { if (!$('#overlay').classList.contains('hidden') && !gameOver) hideOverlay(); else setTool('select'); }
  else if (e.key === 'p' || e.key === 'P') setTool('build', 'path');
  else if (e.key === 'b' || e.key === 'B') setTool('bulldoze');
});
$('#t-select').onclick = () => setTool('select');
$('#t-path').onclick = () => setTool('build', 'path');
$('#t-bull').onclick = () => setTool('bulldoze');
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { curTab = b.dataset.tab; renderTab(); });
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => { const s = +b.dataset.speed; if (s === 0) S.paused = true; else { S.speed = s; S.paused = false; } });
$('#help-btn').onclick = () => showHelp(false);

// ───────────────────────── boot ─────────────────────────
newState();
const loaded = load();
if (loaded) { toast('📂 Welcome back! Your park was restored (paused).'); S.paused = true; hideOverlay(); }
else { S.paused = true; showHelp(true); }
fitCanvas(); setTool('select'); renderTab(); renderInfo(); updateHUD();
requestAnimationFrame(frame);
</script>
</body>
</html>
